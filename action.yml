name: "Claude Code with Shared Prompts"
description: "Claude Code action with org-wide prompts bundled. Optionally layers repo-specific prompts."
author: "ExaDev / AdPeak"
branding:
  icon: "at-sign"
  color: "orange"

inputs:
  mode:
    description: "Mode: interactive, review, or triage"
    required: false
    default: "interactive"
  pr_number:
    description: "Pull request number (required for review mode)"
    required: false
    default: ""
  issue_number:
    description: "Issue number (required for triage mode)"
    required: false
    default: ""
  triage_label:
    description: "Label that triggers re-triage when applied to an issue"
    required: false
    default: "needs-triage"
  update_issue_body:
    description: "Append triage summary to the issue description"
    required: false
    default: "true"
  prompt_dir:
    description: "Override prompt directory (default: interactive or review based on mode)"
    required: false
    default: ""
  claude_code_oauth_token:
    description: "Claude Code OAuth token. Provide one token, or several newline-separated tokens to fall through to the next one if an earlier attempt fails (e.g. separate accounts/subscriptions). Tried in the order given, before any anthropic_api_key entries. Up to 5 credentials total (across both inputs combined) are supported."
    required: false
  anthropic_api_key:
    description: "Anthropic API key (alternative to OAuth token). Provide one key, or several newline-separated keys to fall through to the next one if an earlier attempt fails. Tried in the order given, after every claude_code_oauth_token entry has been exhausted. Up to 5 credentials total (across both inputs combined) are supported."
    required: false
  github_token:
    description: "GitHub token (uses Claude App token if not provided, posts as claude[bot])"
    required: false
  claude_args:
    description: "Override claude args"
    required: false
    default: ""
  # Progress tracking
  track_progress:
    description: "Enable progress tracking with checkbox updates"
    required: false
    default: "false"
  include_fix_links:
    description: "Include 'Fix this' links in PR review feedback"
    required: false
    default: "true"
  use_sticky_comment:
    description: "Use single sticky comment for PR feedback"
    required: false
    default: "false"
  # Triggers
  trigger_phrase:
    description: "Custom trigger phrase (default: @claude)"
    required: false
    default: "@claude"
  assignee_trigger:
    description: "Assignee username that triggers action on issue assignment"
    required: false
    default: ""
  label_trigger:
    description: "Label name that triggers action when applied to issue"
    required: false
    default: "claude"
  # Branch settings
  base_branch:
    description: "The branch to use as the base/source when creating new branches (defaults to repository default branch)"
    required: false
    default: ""
  branch_prefix:
    description: "Prefix for Claude branches (default: claude/)"
    required: false
    default: "claude/"
  branch_name_template:
    description: "Template for branch naming. Available variables: {{prefix}}, {{entityType}}, {{entityNumber}}, {{timestamp}}, {{sha}}, {{label}}, {{description}}. {{label}} will be first label from the issue/PR, or {{entityType}} as a fallback. {{description}} will be the first 5 words of the issue/PR title in kebab-case. Default: '{{prefix}}{{entityType}}-{{entityNumber}}-{{timestamp}}'"
    required: false
    default: ""
  # Permissions
  additional_permissions:
    description: "Additional permissions (e.g., 'actions: read' for CI access)"
    required: false
    default: ""
  allowed_bots:
    description: "Comma-separated list of allowed bot usernames, or '*' to allow all bots. Empty string (default) allows no bots."
    required: false
    default: ""
  allowed_non_write_users:
    description: "Comma-separated list of usernames to allow without write permissions, or '*' to allow all users. Only works when github_token input is provided. WARNING: Use with extreme caution - this bypasses security checks and should only be used for workflows with very limited permissions (e.g., issue labeling)."
    required: false
    default: ""
  include_comments_by_actor:
    description: "Comma-separated list of actor usernames to INCLUDE in comments. Supports wildcards: '*[bot]' matches all bots, 'dependabot[bot]' matches specific bot. Empty (default) includes all actors."
    required: false
    default: ""
  exclude_comments_by_actor:
    description: "Comma-separated list of actor usernames to EXCLUDE from comments. Supports wildcards: '*[bot]' matches all bots, 'renovate[bot]' matches specific bot. Empty (default) excludes none. If actor is in both lists, exclusion takes priority."
    required: false
    default: ""
  # Commit signing
  use_commit_signing:
    description: "Enable commit signing via GitHub API"
    required: false
    default: "false"
  ssh_signing_key:
    description: "SSH private key for signing commits"
    required: false
    default: ""
  bot_id:
    description: "GitHub user ID for git operations"
    required: false
    default: "41898282"
  bot_name:
    description: "GitHub username for git operations"
    required: false
    default: "claude[bot]"
  # Settings
  settings:
    description: "Claude Code settings as JSON string or path to settings file"
    required: false
    default: ""
  # Plugins
  plugins:
    description: "Newline-separated list of plugins to install"
    required: false
    default: ""
  plugin_marketplaces:
    description: "Newline-separated list of plugin marketplace Git URLs"
    required: false
    default: ""
  # Cloud providers
  use_bedrock:
    description: "Use Amazon Bedrock with OIDC"
    required: false
    default: "false"
  use_vertex:
    description: "Use Google Vertex AI with OIDC"
    required: false
    default: "false"
  use_foundry:
    description: "Use Microsoft Foundry with OIDC"
    required: false
    default: "false"
  # Advanced options
  path_to_claude_code_executable:
    description: "Optional path to a custom Claude Code executable. If provided, skips automatic installation and uses this executable instead. WARNING: Using an older version may cause problems if the action begins taking advantage of new Claude Code features. This input is typically not needed unless you're debugging something specific or have unique needs in your environment."
    required: false
    default: ""
  path_to_bun_executable:
    description: "Optional path to a custom Bun executable. If provided, skips automatic Bun installation and uses this executable instead. WARNING: Using an incompatible version may cause problems if the action requires specific Bun features. This input is typically not needed unless you're debugging something specific or have unique needs in your environment."
    required: false
    default: ""
  display_report:
    description: "Whether to display the Claude Code Report in GitHub Step Summary. Set to 'false' to disable when using custom formatting solutions."
    required: false
    default: "true"
  show_full_output:
    description: "Show full JSON output from Claude Code. WARNING: This outputs ALL Claude messages including tool execution results which may contain secrets, API keys, or other sensitive information. These logs are publicly visible in GitHub Actions. Only enable for debugging in non-sensitive environments."
    required: false
    default: "false"

outputs:
  execution_file:
    description: "Path to the Claude Code execution output file"
    value: ${{ steps.result.outputs.execution_file }}
  branch_name:
    description: "The branch created by Claude Code for this execution"
    value: ${{ steps.result.outputs.branch_name }}
  github_token:
    description: "The GitHub token used by the action (Claude App token if available)"
    value: ${{ steps.result.outputs.github_token }}
  structured_output:
    description: "JSON string containing all structured output fields when --json-schema is provided in claude_args. Use fromJSON() to parse: fromJSON(steps.id.outputs.structured_output).field_name"
    value: ${{ steps.result.outputs.structured_output }}
  session_id:
    description: "The Claude Code session ID that can be used with --resume to continue this conversation"
    value: ${{ steps.result.outputs.session_id }}

runs:
  using: "composite"
  steps:
    - name: Compose prompts
      id: compose
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        PR_NUMBER: ${{ inputs.pr_number }}
        PROMPT_DIR: ${{ inputs.prompt_dir }}
        REPO: ${{ github.repository }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}
        BOT_NAME: ${{ inputs.bot_name }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        UPDATE_ISSUE_BODY: ${{ inputs.update_issue_body }}
        TRIAGE_LABEL: ${{ inputs.triage_label }}
      run: |
        # Determine prompt directory
        if [ -n "$PROMPT_DIR" ]; then
          DIR="$PROMPT_DIR"
        elif [ "$MODE" = "review" ]; then
          DIR="review"
        elif [ "$MODE" = "triage" ]; then
          DIR="triage"
        else
          DIR="interactive"
        fi

        # Compose prompts: org-wide (bundled) then repo-specific (if exists)
        PROMPT=""

        # Org-wide shared prompts (bundled in action)
        for f in "${{ github.action_path }}/.github/prompts/shared"/*.md; do
          [ -f "$f" ] || continue
          PROMPT="${PROMPT}$(envsubst '$REPO $REPO_OWNER $REPO_NAME $PR_NUMBER $ISSUE_NUMBER $UPDATE_ISSUE_BODY $TRIAGE_LABEL $BOT_NAME' < "$f")"$'\n'
        done

        # Org-wide mode-specific prompts (bundled)
        for f in "${{ github.action_path }}/.github/prompts/$DIR"/*.md; do
          [ -f "$f" ] || continue
          PROMPT="${PROMPT}$(envsubst '$REPO $REPO_OWNER $REPO_NAME $PR_NUMBER $ISSUE_NUMBER $UPDATE_ISSUE_BODY $TRIAGE_LABEL $BOT_NAME' < "$f")"$'\n'
        done

        # Repo-specific shared prompts (if they exist)
        if [ -d ".github/prompts/shared" ]; then
          for f in .github/prompts/shared/*.md; do
            [ -f "$f" ] || continue
            PROMPT="${PROMPT}$(envsubst '$REPO $REPO_OWNER $REPO_NAME $PR_NUMBER $ISSUE_NUMBER $UPDATE_ISSUE_BODY $TRIAGE_LABEL $BOT_NAME' < "$f")"$'\n'
          done
        fi

        # Repo-specific mode-specific prompts (if they exist)
        if [ -d ".github/prompts/$DIR" ]; then
          for f in ".github/prompts/$DIR"/*.md; do
            [ -f "$f" ] || continue
            PROMPT="${PROMPT}$(envsubst '$REPO $REPO_OWNER $REPO_NAME $PR_NUMBER $ISSUE_NUMBER $UPDATE_ISSUE_BODY $TRIAGE_LABEL $BOT_NAME' < "$f")"$'\n'
          done
        fi

        # Output composed prompt
        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        echo "prompt<<$EOF" >> "$GITHUB_OUTPUT"
        echo "$PROMPT" >> "$GITHUB_OUTPUT"
        echo "$EOF" >> "$GITHUB_OUTPUT"

        # Determine allowed tools based on mode
        COMMON_TOOLS="mcp__github__get_pull_request,mcp__github__get_pull_request_files,mcp__github__get_pull_request_diff,mcp__github__get_pull_request_reviews,mcp__github__list_pull_request_comments,mcp__github__create_pending_pull_request_review,mcp__github__add_comment_to_pending_review,mcp__github__submit_pending_pull_request_review,mcp__github__create_and_submit_pull_request_review,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh api:*)"

        if [ "$MODE" = "review" ]; then
          TOOLS="$COMMON_TOOLS,Read,Grep,Glob,WebFetch,Bash(git diff:*),Bash(git log:*),Bash(git blame:*),Bash(gh issue create:*),Bash(gh pr create:*)"
        elif [ "$MODE" = "triage" ]; then
          TOOLS="Bash(gh api:*),Bash(gh issue edit:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh label list:*),mcp__github__get_issue,mcp__github__list_issues"
        else
          TOOLS="$COMMON_TOOLS,Bash(gh issue comment:*),Bash(gh issue view:*)"
        fi

        echo "tools=$TOOLS" >> "$GITHUB_OUTPUT"

    - name: Parse credential fallback chain
      id: credentials
      shell: bash
      env:
        OAUTH_TOKENS: ${{ inputs.claude_code_oauth_token }}
        API_KEYS: ${{ inputs.anthropic_api_key }}
      run: |
        # claude_code_oauth_token/anthropic_api_key each accept one value or several newline-separated values. Every value found is flattened into a single ordered fallback chain -- every oauth token first (in the order given), then every api key -- capped at MAX entries because a composite action has no native loop: the "Run Claude Code (attempt N)" steps below are statically unrolled, one per chain position, each trying the next credential only if the previous one failed.
        set -euo pipefail

        trim() {
          local s="$1"
          s="${s#"${s%%[![:space:]]*}"}"
          s="${s%"${s##*[![:space:]]}"}"
          printf '%s' "$s"
        }

        declare -a TYPES=()
        declare -a TOKENS=()

        while IFS= read -r line; do
          value="$(trim "$line")"
          [ -z "$value" ] && continue
          TYPES+=("oauth")
          TOKENS+=("$value")
        done <<<"$OAUTH_TOKENS"

        while IFS= read -r line; do
          value="$(trim "$line")"
          [ -z "$value" ] && continue
          TYPES+=("key")
          TOKENS+=("$value")
        done <<<"$API_KEYS"

        COUNT=${#TOKENS[@]}
        MAX=5

        if [ "$COUNT" -gt "$MAX" ]; then
          echo "::error::${COUNT} credentials were supplied across claude_code_oauth_token and anthropic_api_key combined, but this action only wires up ${MAX} fallback attempts. Trim the list to ${MAX} or fewer, or extend the attempt_N steps in action.yml to raise the cap." >&2
          exit 1
        fi

        for i in "${!TOKENS[@]}"; do
          idx=$((i + 1))
          echo "::add-mask::${TOKENS[$i]}"
          echo "cred_${idx}_type=${TYPES[$i]}" >>"$GITHUB_OUTPUT"
          echo "cred_${idx}_token=${TOKENS[$i]}" >>"$GITHUB_OUTPUT"
        done

        echo "credential_count=${COUNT}" >>"$GITHUB_OUTPUT"

    - name: Run Claude Code (attempt 1)
      id: attempt_1
      continue-on-error: true
      uses: anthropics/claude-code-action@v1
      with:
        prompt: ${{ steps.compose.outputs.prompt }}
        claude_code_oauth_token: ${{ steps.credentials.outputs.cred_1_type == 'oauth' && steps.credentials.outputs.cred_1_token || '' }}
        anthropic_api_key: ${{ steps.credentials.outputs.cred_1_type == 'key' && steps.credentials.outputs.cred_1_token || '' }}
        github_token: ${{ inputs.github_token }}
        claude_args: ${{ inputs.claude_args || format('--max-turns 50 --allowedTools "{0}"', steps.compose.outputs.tools) }}
        track_progress: ${{ inputs.track_progress }}
        include_fix_links: ${{ inputs.include_fix_links }}
        use_sticky_comment: ${{ inputs.use_sticky_comment }}
        trigger_phrase: ${{ inputs.trigger_phrase }}
        assignee_trigger: ${{ inputs.assignee_trigger }}
        label_trigger: ${{ inputs.label_trigger }}
        base_branch: ${{ inputs.base_branch }}
        branch_prefix: ${{ inputs.branch_prefix }}
        branch_name_template: ${{ inputs.branch_name_template }}
        additional_permissions: ${{ inputs.additional_permissions }}
        allowed_bots: ${{ inputs.allowed_bots }}
        allowed_non_write_users: ${{ inputs.allowed_non_write_users }}
        include_comments_by_actor: ${{ inputs.include_comments_by_actor }}
        exclude_comments_by_actor: ${{ inputs.exclude_comments_by_actor }}
        use_commit_signing: ${{ inputs.use_commit_signing }}
        ssh_signing_key: ${{ inputs.ssh_signing_key }}
        bot_id: ${{ inputs.bot_id }}
        bot_name: ${{ inputs.bot_name }}
        settings: ${{ inputs.settings }}
        plugins: ${{ inputs.plugins }}
        plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
        use_bedrock: ${{ inputs.use_bedrock }}
        use_vertex: ${{ inputs.use_vertex }}
        use_foundry: ${{ inputs.use_foundry }}
        path_to_claude_code_executable: ${{ inputs.path_to_claude_code_executable }}
        path_to_bun_executable: ${{ inputs.path_to_bun_executable }}
        display_report: ${{ inputs.display_report }}
        show_full_output: ${{ inputs.show_full_output }}

    - name: Run Claude Code (attempt 2)
      id: attempt_2
      if: steps.credentials.outputs.cred_2_token != '' && steps.attempt_1.outcome == 'failure'
      continue-on-error: true
      uses: anthropics/claude-code-action@v1
      with:
        prompt: ${{ steps.compose.outputs.prompt }}
        claude_code_oauth_token: ${{ steps.credentials.outputs.cred_2_type == 'oauth' && steps.credentials.outputs.cred_2_token || '' }}
        anthropic_api_key: ${{ steps.credentials.outputs.cred_2_type == 'key' && steps.credentials.outputs.cred_2_token || '' }}
        github_token: ${{ inputs.github_token }}
        claude_args: ${{ inputs.claude_args || format('--max-turns 50 --allowedTools "{0}"', steps.compose.outputs.tools) }}
        track_progress: ${{ inputs.track_progress }}
        include_fix_links: ${{ inputs.include_fix_links }}
        use_sticky_comment: ${{ inputs.use_sticky_comment }}
        trigger_phrase: ${{ inputs.trigger_phrase }}
        assignee_trigger: ${{ inputs.assignee_trigger }}
        label_trigger: ${{ inputs.label_trigger }}
        base_branch: ${{ inputs.base_branch }}
        branch_prefix: ${{ inputs.branch_prefix }}
        branch_name_template: ${{ inputs.branch_name_template }}
        additional_permissions: ${{ inputs.additional_permissions }}
        allowed_bots: ${{ inputs.allowed_bots }}
        allowed_non_write_users: ${{ inputs.allowed_non_write_users }}
        include_comments_by_actor: ${{ inputs.include_comments_by_actor }}
        exclude_comments_by_actor: ${{ inputs.exclude_comments_by_actor }}
        use_commit_signing: ${{ inputs.use_commit_signing }}
        ssh_signing_key: ${{ inputs.ssh_signing_key }}
        bot_id: ${{ inputs.bot_id }}
        bot_name: ${{ inputs.bot_name }}
        settings: ${{ inputs.settings }}
        plugins: ${{ inputs.plugins }}
        plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
        use_bedrock: ${{ inputs.use_bedrock }}
        use_vertex: ${{ inputs.use_vertex }}
        use_foundry: ${{ inputs.use_foundry }}
        path_to_claude_code_executable: ${{ inputs.path_to_claude_code_executable }}
        path_to_bun_executable: ${{ inputs.path_to_bun_executable }}
        display_report: ${{ inputs.display_report }}
        show_full_output: ${{ inputs.show_full_output }}

    - name: Run Claude Code (attempt 3)
      id: attempt_3
      if: steps.credentials.outputs.cred_3_token != '' && steps.attempt_2.outcome == 'failure'
      continue-on-error: true
      uses: anthropics/claude-code-action@v1
      with:
        prompt: ${{ steps.compose.outputs.prompt }}
        claude_code_oauth_token: ${{ steps.credentials.outputs.cred_3_type == 'oauth' && steps.credentials.outputs.cred_3_token || '' }}
        anthropic_api_key: ${{ steps.credentials.outputs.cred_3_type == 'key' && steps.credentials.outputs.cred_3_token || '' }}
        github_token: ${{ inputs.github_token }}
        claude_args: ${{ inputs.claude_args || format('--max-turns 50 --allowedTools "{0}"', steps.compose.outputs.tools) }}
        track_progress: ${{ inputs.track_progress }}
        include_fix_links: ${{ inputs.include_fix_links }}
        use_sticky_comment: ${{ inputs.use_sticky_comment }}
        trigger_phrase: ${{ inputs.trigger_phrase }}
        assignee_trigger: ${{ inputs.assignee_trigger }}
        label_trigger: ${{ inputs.label_trigger }}
        base_branch: ${{ inputs.base_branch }}
        branch_prefix: ${{ inputs.branch_prefix }}
        branch_name_template: ${{ inputs.branch_name_template }}
        additional_permissions: ${{ inputs.additional_permissions }}
        allowed_bots: ${{ inputs.allowed_bots }}
        allowed_non_write_users: ${{ inputs.allowed_non_write_users }}
        include_comments_by_actor: ${{ inputs.include_comments_by_actor }}
        exclude_comments_by_actor: ${{ inputs.exclude_comments_by_actor }}
        use_commit_signing: ${{ inputs.use_commit_signing }}
        ssh_signing_key: ${{ inputs.ssh_signing_key }}
        bot_id: ${{ inputs.bot_id }}
        bot_name: ${{ inputs.bot_name }}
        settings: ${{ inputs.settings }}
        plugins: ${{ inputs.plugins }}
        plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
        use_bedrock: ${{ inputs.use_bedrock }}
        use_vertex: ${{ inputs.use_vertex }}
        use_foundry: ${{ inputs.use_foundry }}
        path_to_claude_code_executable: ${{ inputs.path_to_claude_code_executable }}
        path_to_bun_executable: ${{ inputs.path_to_bun_executable }}
        display_report: ${{ inputs.display_report }}
        show_full_output: ${{ inputs.show_full_output }}

    - name: Run Claude Code (attempt 4)
      id: attempt_4
      if: steps.credentials.outputs.cred_4_token != '' && steps.attempt_3.outcome == 'failure'
      continue-on-error: true
      uses: anthropics/claude-code-action@v1
      with:
        prompt: ${{ steps.compose.outputs.prompt }}
        claude_code_oauth_token: ${{ steps.credentials.outputs.cred_4_type == 'oauth' && steps.credentials.outputs.cred_4_token || '' }}
        anthropic_api_key: ${{ steps.credentials.outputs.cred_4_type == 'key' && steps.credentials.outputs.cred_4_token || '' }}
        github_token: ${{ inputs.github_token }}
        claude_args: ${{ inputs.claude_args || format('--max-turns 50 --allowedTools "{0}"', steps.compose.outputs.tools) }}
        track_progress: ${{ inputs.track_progress }}
        include_fix_links: ${{ inputs.include_fix_links }}
        use_sticky_comment: ${{ inputs.use_sticky_comment }}
        trigger_phrase: ${{ inputs.trigger_phrase }}
        assignee_trigger: ${{ inputs.assignee_trigger }}
        label_trigger: ${{ inputs.label_trigger }}
        base_branch: ${{ inputs.base_branch }}
        branch_prefix: ${{ inputs.branch_prefix }}
        branch_name_template: ${{ inputs.branch_name_template }}
        additional_permissions: ${{ inputs.additional_permissions }}
        allowed_bots: ${{ inputs.allowed_bots }}
        allowed_non_write_users: ${{ inputs.allowed_non_write_users }}
        include_comments_by_actor: ${{ inputs.include_comments_by_actor }}
        exclude_comments_by_actor: ${{ inputs.exclude_comments_by_actor }}
        use_commit_signing: ${{ inputs.use_commit_signing }}
        ssh_signing_key: ${{ inputs.ssh_signing_key }}
        bot_id: ${{ inputs.bot_id }}
        bot_name: ${{ inputs.bot_name }}
        settings: ${{ inputs.settings }}
        plugins: ${{ inputs.plugins }}
        plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
        use_bedrock: ${{ inputs.use_bedrock }}
        use_vertex: ${{ inputs.use_vertex }}
        use_foundry: ${{ inputs.use_foundry }}
        path_to_claude_code_executable: ${{ inputs.path_to_claude_code_executable }}
        path_to_bun_executable: ${{ inputs.path_to_bun_executable }}
        display_report: ${{ inputs.display_report }}
        show_full_output: ${{ inputs.show_full_output }}

    - name: Run Claude Code (attempt 5)
      id: attempt_5
      if: steps.credentials.outputs.cred_5_token != '' && steps.attempt_4.outcome == 'failure'
      continue-on-error: true
      uses: anthropics/claude-code-action@v1
      with:
        prompt: ${{ steps.compose.outputs.prompt }}
        claude_code_oauth_token: ${{ steps.credentials.outputs.cred_5_type == 'oauth' && steps.credentials.outputs.cred_5_token || '' }}
        anthropic_api_key: ${{ steps.credentials.outputs.cred_5_type == 'key' && steps.credentials.outputs.cred_5_token || '' }}
        github_token: ${{ inputs.github_token }}
        claude_args: ${{ inputs.claude_args || format('--max-turns 50 --allowedTools "{0}"', steps.compose.outputs.tools) }}
        track_progress: ${{ inputs.track_progress }}
        include_fix_links: ${{ inputs.include_fix_links }}
        use_sticky_comment: ${{ inputs.use_sticky_comment }}
        trigger_phrase: ${{ inputs.trigger_phrase }}
        assignee_trigger: ${{ inputs.assignee_trigger }}
        label_trigger: ${{ inputs.label_trigger }}
        base_branch: ${{ inputs.base_branch }}
        branch_prefix: ${{ inputs.branch_prefix }}
        branch_name_template: ${{ inputs.branch_name_template }}
        additional_permissions: ${{ inputs.additional_permissions }}
        allowed_bots: ${{ inputs.allowed_bots }}
        allowed_non_write_users: ${{ inputs.allowed_non_write_users }}
        include_comments_by_actor: ${{ inputs.include_comments_by_actor }}
        exclude_comments_by_actor: ${{ inputs.exclude_comments_by_actor }}
        use_commit_signing: ${{ inputs.use_commit_signing }}
        ssh_signing_key: ${{ inputs.ssh_signing_key }}
        bot_id: ${{ inputs.bot_id }}
        bot_name: ${{ inputs.bot_name }}
        settings: ${{ inputs.settings }}
        plugins: ${{ inputs.plugins }}
        plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
        use_bedrock: ${{ inputs.use_bedrock }}
        use_vertex: ${{ inputs.use_vertex }}
        use_foundry: ${{ inputs.use_foundry }}
        path_to_claude_code_executable: ${{ inputs.path_to_claude_code_executable }}
        path_to_bun_executable: ${{ inputs.path_to_bun_executable }}
        display_report: ${{ inputs.display_report }}
        show_full_output: ${{ inputs.show_full_output }}

    - name: Determine result
      id: result
      shell: bash
      env:
        CREDENTIAL_COUNT: ${{ steps.credentials.outputs.credential_count }}
        OUTCOME_1: ${{ steps.attempt_1.outcome }}
        OUTCOME_2: ${{ steps.attempt_2.outcome }}
        OUTCOME_3: ${{ steps.attempt_3.outcome }}
        OUTCOME_4: ${{ steps.attempt_4.outcome }}
        OUTCOME_5: ${{ steps.attempt_5.outcome }}
        EXECUTION_FILE_1: ${{ steps.attempt_1.outputs.execution_file }}
        EXECUTION_FILE_2: ${{ steps.attempt_2.outputs.execution_file }}
        EXECUTION_FILE_3: ${{ steps.attempt_3.outputs.execution_file }}
        EXECUTION_FILE_4: ${{ steps.attempt_4.outputs.execution_file }}
        EXECUTION_FILE_5: ${{ steps.attempt_5.outputs.execution_file }}
        BRANCH_NAME_1: ${{ steps.attempt_1.outputs.branch_name }}
        BRANCH_NAME_2: ${{ steps.attempt_2.outputs.branch_name }}
        BRANCH_NAME_3: ${{ steps.attempt_3.outputs.branch_name }}
        BRANCH_NAME_4: ${{ steps.attempt_4.outputs.branch_name }}
        BRANCH_NAME_5: ${{ steps.attempt_5.outputs.branch_name }}
        GITHUB_TOKEN_OUT_1: ${{ steps.attempt_1.outputs.github_token }}
        GITHUB_TOKEN_OUT_2: ${{ steps.attempt_2.outputs.github_token }}
        GITHUB_TOKEN_OUT_3: ${{ steps.attempt_3.outputs.github_token }}
        GITHUB_TOKEN_OUT_4: ${{ steps.attempt_4.outputs.github_token }}
        GITHUB_TOKEN_OUT_5: ${{ steps.attempt_5.outputs.github_token }}
        STRUCTURED_OUTPUT_1: ${{ steps.attempt_1.outputs.structured_output }}
        STRUCTURED_OUTPUT_2: ${{ steps.attempt_2.outputs.structured_output }}
        STRUCTURED_OUTPUT_3: ${{ steps.attempt_3.outputs.structured_output }}
        STRUCTURED_OUTPUT_4: ${{ steps.attempt_4.outputs.structured_output }}
        STRUCTURED_OUTPUT_5: ${{ steps.attempt_5.outputs.structured_output }}
        SESSION_ID_1: ${{ steps.attempt_1.outputs.session_id }}
        SESSION_ID_2: ${{ steps.attempt_2.outputs.session_id }}
        SESSION_ID_3: ${{ steps.attempt_3.outputs.session_id }}
        SESSION_ID_4: ${{ steps.attempt_4.outputs.session_id }}
        SESSION_ID_5: ${{ steps.attempt_5.outputs.session_id }}
      run: |
        # Exactly one attempt_N step is expected to have succeeded (the chain stops at the first success); this picks that one's outputs. If every attempted credential failed, continue-on-error on the attempt_N steps above would otherwise let the whole composite action report success -- so this step is what actually surfaces the failure.
        set -euo pipefail

        WINNER=""
        for i in 1 2 3 4 5; do
          var="OUTCOME_${i}"
          if [ "${!var:-}" = "success" ]; then
            WINNER="$i"
            break
          fi
        done

        if [ -z "$WINNER" ]; then
          echo "::error::All ${CREDENTIAL_COUNT:-0} attempted credential(s) failed to run Claude Code. See the individual 'Run Claude Code (attempt N)' step logs above for the underlying error from each." >&2
          exit 1
        fi

        echo "Credential attempt ${WINNER} succeeded."

        for field in execution_file branch_name github_token structured_output session_id; do
          case "$field" in
          execution_file) var="EXECUTION_FILE_${WINNER}" ;;
          branch_name) var="BRANCH_NAME_${WINNER}" ;;
          github_token) var="GITHUB_TOKEN_OUT_${WINNER}" ;;
          structured_output) var="STRUCTURED_OUTPUT_${WINNER}" ;;
          session_id) var="SESSION_ID_${WINNER}" ;;
          esac
          value="${!var:-}"
          delim=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "${field}<<${delim}"
            echo "${value}"
            echo "${delim}"
          } >>"$GITHUB_OUTPUT"
        done
