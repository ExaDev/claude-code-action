          for f in "${session_files[@]}"; do
            [ "$f" -nt "$prior_session" ] && prior_session="$f"
          done
          [ -s "$prior_session" ] || prior_session=""
        fi
        BASE_ARGS="${BASE_ARGS:-}"
        if [ -n "$prior_session" ]; then
          RESUME_ID="$(basename "$prior_session" .jsonl)"
          FINAL_ARGS="--resume ${RESUME_ID} ${BASE_ARGS}"
          echo "Resuming prior session ${RESUME_ID} (${prior_session})."
        else
          FINAL_ARGS="${BASE_ARGS}"
          echo "No prior session under ${PROJECT_DIR}; starting fresh."
        fi
        delim="RESUME_ARGS_$(openssl rand -hex 16)"
        {
          echo "claude_args<<${delim}"
          echo "$FINAL_ARGS"
          echo "${delim}"
