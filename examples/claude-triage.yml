# Copy this to .github/workflows/claude-triage.yml in a repository in your organisation.
#
# When an issue is opened, re-labelled for re-triage, or dispatched by hand, Claude works out what it is, looks for duplicates, applies existing labels, says what information is missing, and suggests where to start looking.
#
# Set the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret (organisation or repository level) first. Either works; wire through whichever you set.

name: Claude Triage

on:
  issues:
    types: [opened, labeled]
  # Triage an existing issue on demand, from the Actions tab or `gh workflow run claude-triage.yml -f issue_number=123`. Only someone with write access to the repository can dispatch a workflow.
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Number of the issue to triage"
        required: true
        type: number

# One triage run per issue at a time, so a new issue that is labelled straight away, or re-labelled or dispatched for re-triage while a run is still going, never has two runs writing to it together. Runs queue rather than cancel, so a run in flight is never cut off half way through posting.
concurrency:
  group: claude-triage-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    # `labeled` fires for every label applied to any issue, so it only runs for the re-triage label (`needs-triage`, triage mode's default; if you rename it, change it here and in the `triage_label` input). A newly opened issue and a manual dispatch always run.
    if: github.event.action != 'labeled' || github.event.label.name == 'needs-triage'
    # Matches triage.yml@v1's own permissions: block exactly; see claude-review.yml's comment and the README's step 3 for why declaring this is safe and correct rather than something to avoid.
    permissions:
      contents: read
      issues: write
    uses: ExaDev/claude-code-action/.github/workflows/triage.yml@v1
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      # Empty for an issues event, where the number is read from the event itself; set by a manual dispatch, which carries no issue.
      issue_number: ${{ inputs.issue_number }}
      # Without this, only issues opened by someone with repository write access are triaged, which for most repositories means almost none of them. Setting it to '*' triages everyone's issues and is usually the point of running triage.
      #
      # It does mean untrusted issue text reaches the model, so read the security notes in the action's README before enabling it. Triage mode holds no pull-request or code-write scope, which is what makes this trade-off acceptable here; do not copy the same setting into the interactive workflow.
      allowed_non_write_users: "*"
      # An issue opened by a bot fails the run with "Workflow initiated by non-human actor" unless that bot is named here, so list any automation that files issues you want triaged (comma-separated logins). Naming them is safer than '*', which allows every bot.
      # allowed_bots: "your-reporting-bot"
      # Every other input is optional with a sensible default — see .github/workflows/triage.yml in ExaDev/claude-code-action for the full list and what each does.
