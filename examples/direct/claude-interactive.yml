# Composite-action-step (direct) form of claude-interactive.yml. Copy this to .github/workflows/claude-interactive.yml in a repository in your organisation.
#
# This calls the composite action directly as a step rather than through the reusable workflow (examples/claude-interactive.yml), so the job can scope its own token (the reusable form cannot take a caller permissions: block). See the header of claude-review.yml in this directory for the general reason you'd pick the direct form.
#
# Mention @claude in an issue comment, a pull request comment, or a review, and Claude answers the question or makes the change on a branch and opens a pull request. Only users with repository write access can invoke it, which is deliberate: this mode can change code. See the security notes in the action's README.
#
# Set the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret (organisation or repository level) first. Either works; wire through whichever you set.
#
# NOTE: the trigger phrase is matched in the job `if:` below (hardcoded to @claude). If you change the action's trigger_phrase input to something else, update that condition to match -- supplying a prompt puts the underlying action into agent mode, which runs unconditionally and does not check the phrase itself, so without this guard every comment would start a paid run.
#
# The job `if:` also excludes any bot-authored event (github.event.sender.type != 'Bot') -- confirmed directly on novus-power/hive (commit f509aa9a64): Anthropic's native Claude Code Review GitHub App posts a boilerplate "Comment @claude review for a one-time review..." notice on every pull request when its own automatic review is set to manual, and that boilerplate's own "@claude review" substring satisfied this trigger from the bot's own submission -- wasting a full checkout, Claude Code install, and OIDC/App token exchange for nothing. Update this guard too if you widen `trigger_phrase` to something a bot's own routine output might also contain.

name: Claude Interactive

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  interactive:
    if: |
      github.event.sender.type != 'Bot' && (
        (
          (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
          && contains(github.event.comment.body, '@claude')
        ) || (
          github.event_name == 'pull_request_review'
          && contains(github.event.review.body, '@claude')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so a branch can be created and pushed from a sensible base.
          fetch-depth: 0
      - uses: ExaDev/claude-code-action@v1
        with:
          mode: interactive
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # ssh_signing_key is also available here as a secret, optional: sign commits with a real SSH key rather than plain git commits or GitHub-verified signing (use_commit_signing, a separate input, needs no key).
          #
          # Do not set allowed_non_write_users here. This mode can commit code and push a branch, so widening it hands write access to anyone who can write a comment. Every other input is optional with a sensible default -- see action.yml for the full list.
