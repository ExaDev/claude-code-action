# Composite-action-step (direct) form of claude-review.yml with the opt-in automatic fix pass turned on. Copy this to .github/workflows/claude-review.yml in a repository in your organisation -- INSTEAD OF, not alongside, either of the other two review examples.
#
# READ THIS BEFORE YOU COPY IT. Every other review workflow in this repository is read-only by construction: the worst a subverted or prompt-injected review can do is post a misleading comment, and that boundary is the reason review is a separate entry point from interactive at all. This file removes it. With fix_ci_failures or fix_diff_findings on, a second call after the review edits files and commits them, and this job pushes that commit to the pull request's branch -- so a review that has been talked into writing the wrong thing now writes it into someone's branch, where the next person to look may reasonably assume a bot-authored commit was checked by something. Use this on repositories whose pull requests come from people you would already give write access to, and nowhere else. It is not a default to roll out across the estate.
#
# Three limits bound that, and none of them is the prompt:
#   - Fork pull requests never reach the fix call. This job's token cannot push to a fork, so the action skips the
#     whole pass before it costs anything -- which is exactly the untrusted case.
#   - The push target is fixed. The action pushes to this pull request's own head branch and nothing else, from a
# bash step; the model has no git push tool at all, and anything it writes is discarded with the runner if that step does not publish it.
#   - The review call itself is still read-only. Write and Edit stay on its denylist. Only the separate follow-up
# call can touch a file. What is NOT bounded is the content of a fix, and the contents: write below is broader than the one branch that gets pushed to. Branch protection on your default branch is what makes that safe. Turn it on.
#
# Two things differ from examples/direct/claude-review.yml besides the flags:
#   - contents: write, not contents: read. The fix commit's own push authenticates separately from the review, as
# this repository's own sync App's installation token, minted below and passed as push_token -- not as the Claude Code App. The App identity from the OIDC exchange governs API calls for the review itself; the push_token input governs only the fix pass's git operations. So there are two identities in this one job: claude[bot] reviews, the sync App pushes.
#   - Because of that: a push authenticated with the plain job GITHUB_TOKEN never starts new workflow runs, so checks
# would not automatically re-run on the fix commit if push_token were left unset -- this is why push_token is wired below to the sync App's own installation token instead. That App is minimal (contents: write only, the same one ci.yml's release job already mints) and a push authenticated by a real GitHub App installation token does start workflow runs, so checks do re-run on the fix commit. Do NOT hand this token to actions/checkout's own token: input instead -- the action's fix-push step never uses the checkout-persisted credential, it builds its own authenticated URL from push_token (see action.yml's "Publish applied fixes" step), so wiring it into checkout would do nothing.
#
# fix_ci_failures requires include_ci_logs: true (the run fails at validation otherwise) and the actions: read scope below. It acts on CI results that already exist when the review runs, so on the first push of a pull request there is usually nothing recorded yet; it earns its keep on re-review after a push that broke something.
#
# A gate step first decides whether the triggering event changed anything worth reviewing, exactly as in examples/direct/claude-review.yml (a commit already reviewed and not dismissed, a title or body edit, and the merge commit of GitHub's "Update branch" button are skipped; a base-branch retarget is reviewed), and every later step runs only if it says to review.
#
# Requires the Claude Code GitHub App installed on the organisation (https://github.com/apps/claude) and a CLAUDE_CODE_OAUTH_TOKEN secret, exactly as examples/direct/claude-review.yml does. Do NOT pass github_token -- leaving it unset is what makes the review run as claude[bot]. Also requires the sync App's own vars.EXADEV_APP_ID and secrets.EXADEV_SYNC_PRIVATE_KEY, the same ones ci.yml's release job already relies on -- if this repository does not have that App installed, either install it first or drop the create-github-app-token step and the push_token input below and accept that fix commits will not retrigger checks.

name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: write # the fix commit is pushed with the sync App's own token; contents: read makes the whole fix pass a no-op
  pull-requests: write
  actions: read # required by include_ci_logs, which fix_ci_failures in turn requires
  id-token: write # the OIDC exchange that mints both the Claude Code App token and the sync App's installation token needs this

# Reviewing every push to a busy branch gets expensive, and it matters more here: a cancelled run must not leave a half-applied fix. It cannot -- the commit is only ever published by the final step -- but cancelling early is still the cheaper outcome.
# A title or body edit, which the gate skips, gets a group of its own: sharing the group would let a skipped run cancel a review in flight and leave the commit unreviewed. A base-branch retarget keeps the shared group, because it changes the diff the in-flight review is reading.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}${{ github.event.action == 'edited' && !github.event.changes.base && '-metadata-edit' || '' }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether this event changed anything worth reviewing
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Non-empty only when an `edited` event actually retargeted the base branch, rather than editing the title or body.
          BASE_CHANGED: ${{ toJSON(github.event.changes.base) }}
          REVIEWER: "claude[bot]" # This form leaves github_token unset, so the review is submitted by the Claude Code App and prior reviews are attributed to this login. Passing github_token would make it github-actions[bot] instead.
        run: |
          set -euo pipefail

          skip() { echo "should_review=false" >> "$GITHUB_OUTPUT"; echo "SKIP: $1"; exit 0; }
          review() { echo "should_review=true" >> "$GITHUB_OUTPUT"; echo "REVIEW: $1"; exit 0; }

          # Any unexpected failure (an API hiccup, an unreadable payload) must fall through to a review. A gate that failed closed would silently stop reviewing the repository altogether, which is a far worse outcome than one wasted run.
          trap 'review "gate errored; failing open"' ERR

          # `edited` fires when a pull request's base branch is retargeted, which is what GitHub does to a stacked pull request when its parent merges and the parent's branch is deleted, and it also fires on every title and body edit. Without the trigger a review stays pinned to a diff nobody is merging; without this branch, editing a description would cost a full review.
          if [ "$ACTION" = "edited" ]; then
            if [ "$BASE_CHANGED" = "null" ]; then
              skip "pull request metadata edited, base branch unchanged"
            fi
            # A retarget keeps the same head sha but changes the diff, so this must reach a review even though the already-reviewed check below would otherwise match it. Hence its position above that check rather than below.
            review "base branch retargeted"
          fi

          # A review already submitted against this exact commit has said everything there is to say about it. Catches two triggers landing together, a manual re-run of an earlier run, and `ready_for_review` on a draft whose current commit was already reviewed. A DISMISSED review does not count: GitHub dismisses the bot's approval when the base branch changes, and a review that no longer stands says nothing about the commit, so a re-run at the same commit must be able to review it again. The API does not say why a review was dismissed, so this also covers one a maintainer dismissed by hand: a later trigger at that commit may review it again, which is the accepted cost of not depending on the dismissal's cause.
          #
          # --paginate without --jq in the same call: the reviews endpoint is array-shaped, so gh merges every page into one array before jq sees it. Combining the two would instead run the filter once per page and concatenate the per-page booleans, so any match past the first page would be missed.
          ALREADY=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate \
            | jq --arg sha "$HEAD_SHA" --arg who "$REVIEWER" \
                 '[.[] | select(.user.login == $who and .commit_id == $sha and .state != "DISMISSED")] | length > 0')
          if [ "$ALREADY" = "true" ]; then
            skip "$REVIEWER has already reviewed $HEAD_SHA"
          fi

          # Everything that is not a new push (opened / reopened / ready_for_review) is review-worthy from here.
          if [ "$ACTION" != "synchronize" ]; then
            review "action=$ACTION"
          fi

          # From here it is a push, and the case worth skipping is GitHub's "Update branch" button, which merges the base branch into the pull request and introduces none of the author's own changes.
          PARENTS=$(gh api "repos/$REPO/commits/$AFTER" --jq '.parents[].sha' | tr '\n' ' ')
          read -r P1 P2 EXTRA <<< "$PARENTS"

          if [ -z "${P2:-}" ] || [ -n "${EXTRA:-}" ]; then
            review "head commit is not a two-parent merge"
          fi

          # A base merge keeps the previous head as its first parent. A force-push, rebase or squash does not, and any of those can change the author's own work.
          if [ "$P1" != "$BEFORE" ]; then
            review "first parent is not the previous head (force-push or rebase)"
          fi

          # The second parent must already be contained in the base branch, or this merged something other than the base.
          STATUS=$(gh api "repos/$REPO/compare/$P2...$BASE_REF" --jq '.status' 2>/dev/null || echo "unknown")
          case "$STATUS" in
            identical|ahead) ;;
            *) review "second parent is not an ancestor of $BASE_REF (status=$STATUS)" ;;
          esac

          # The "Update branch" button is only offered for a conflict-free merge, and GitHub commits the result itself. A merge pushed from a workstation looks identical in shape but can carry conflict resolutions, which are real code and never reviewed, so it is deliberately still reviewed.
          COMMITTER=$(gh api "repos/$REPO/commits/$AFTER" --jq '.commit.committer.name')
          if [ "$COMMITTER" != "GitHub" ]; then
            review "merge was committed by '$COMMITTER', not the Update branch button"
          fi

          skip "base branch merged in via the Update branch button; no new author changes"
      # Mints this repository's own sync App's installation token, passed as push_token below so the fix pass's own push authenticates as that App rather than this job's own GITHUB_TOKEN, so a fix commit does start new workflow runs. Same App, same mechanism, as ci.yml's release job.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.decide.outputs.should_review == 'true'
        id: app-token
        with:
          app-id: ${{ vars.EXADEV_APP_ID }}
          private-key: ${{ secrets.EXADEV_SYNC_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.decide.outputs.should_review == 'true'
        with:
          # Full history: review compares against the base branch locally, and the fix pass needs to move the tree onto the pull request's real head branch (this event checks out the merge ref in detached HEAD, which cannot be pushed back). Plain checkout, no token: override -- the fix pass never uses this credential (see the header comment).
          fetch-depth: 0
      - uses: ExaDev/claude-code-action@v1
        if: steps.decide.outputs.should_review == 'true'
        with:
          mode: review
          # No github_token: leaving it unset is what makes the review run as the Claude Code App (claude[bot]). See the header comment.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          include_ci_logs: true
          fix_ci_failures: true
          fix_diff_findings: true
          add_regression_tests: true
          push_token: ${{ steps.app-token.outputs.token }} # governs only the fix commit's own push, not the review call above
          # Every other input is optional with a sensible default -- see action.yml for the full list.
