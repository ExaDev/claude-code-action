# Composite-action-step (direct) form of claude-review.yml. Copy this to .github/workflows/claude-review.yml in a repository in your organisation.
#
# This calls the composite action directly as a step rather than through the reusable workflow (examples/claude-review.yml), and it is the form that runs review as the Claude Code GitHub App (claude[bot]) -- which is the only identity that can submit a formal review AND resolve the bot's own stale threads on a re-review (resolve_stale_threads). The default github-actions[bot] token the reusable form uses is forbidden from both. Use this direct form when you want the App identity, the caller-side permissions: block below, or OIDC-based auth (Bedrock/Vertex/Foundry/Anthropic federation). Otherwise prefer examples/claude-review.yml -- it is shorter.
#
# Requires the Claude Code GitHub App installed on the organisation (https://github.com/apps/claude) and a CLAUDE_CODE_OAUTH_TOKEN secret, because the App token is minted per-run by an OIDC exchange that needs both. Do NOT pass github_token here -- leaving it unset is what makes the upstream take on the App identity; passing it would force github-actions[bot] and moderation would fail with FORBIDDEN, exactly as it does in the reusable form.
#
# Trade-off: the App token carries broad scopes (contents: write, workflows: write, and more) rather than the tight contents: read the reusable form's GITHUB_TOKEN is scoped to, so the prompt is the control on what review does, not the token scope. See the README's security notes before pointing this at a repository that accepts untrusted fork pull requests.
#
# Claude reviews every pull request when it is opened, when new commits are pushed to it, and when a draft is marked ready for review. It submits a formal review -- inline comments plus a summary body -- and by default approves a clean review (drop 'approve' from allowed_review_states if a human should be the only one who can merge).
#
# A gate decides whether the triggering event changed anything worth reviewing, and the review runs only if it did. It does no checkout and makes at most three API calls, so a skip costs seconds instead of a review of the whole diff. It skips a commit this reviewer has already reviewed -- two triggers landing together, or a re-run -- and it skips the merge commit GitHub's "Update branch" button creates, which introduces none of the author's own changes. It fails open: anything unexpected falls through to a review.

name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  actions: read # only used when include_ci_logs is true; read-only, covers workflow-run metadata and logs
  id-token: write # the OIDC exchange that mints the Claude Code App token needs this; the reusable-workflow form cannot grant it, which is why resolve_stale_threads only works here

# Reviewing every push to a busy branch gets expensive. This cancels an in-flight review when the author pushes again.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether this event changed anything worth reviewing
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Non-empty only when an `edited` event actually retargeted the base branch, rather than editing the title or body.
          BASE_CHANGED: ${{ toJSON(github.event.changes.base) }}
          REVIEWER: "claude[bot]" # This form leaves github_token unset, so the review is submitted by the Claude Code App and prior reviews are attributed to this login. Passing github_token would make it github-actions[bot] instead.
        run: |
          set -euo pipefail

          skip() { echo "should_review=false" >> "$GITHUB_OUTPUT"; echo "SKIP: $1"; exit 0; }
          review() { echo "should_review=true" >> "$GITHUB_OUTPUT"; echo "REVIEW: $1"; exit 0; }

          # Any unexpected failure -- an API hiccup, an unreadable payload -- must fall through to a review. A gate that failed closed would silently stop reviewing the repository altogether, which is a far worse outcome than one wasted run.
          trap 'review "gate errored; failing open"' ERR

          # `edited` is not in this workflow's own trigger list, but it is the usual first addition: it fires when a pull request's base branch is retargeted, and without it a review stays pinned to a diff nobody is merging. It also fires on every title and body edit, so adding the trigger without this branch means editing a description costs a full review. Handled here so the trigger is safe to add.
          if [ "$ACTION" = "edited" ]; then
            if [ "$BASE_CHANGED" = "null" ]; then
              skip "pull request metadata edited, base branch unchanged"
            fi
            # A retarget keeps the same head sha but changes the diff, so this must reach a review even though the already-reviewed check below would otherwise match it. Hence its position above that check rather than below.
            review "base branch retargeted"
          fi

          # A review already submitted against this exact commit has said everything there is to say about it. Catches two triggers landing together, a manual re-run of an earlier run, and `ready_for_review` on a draft whose current commit was already reviewed.
          #
          # --paginate without --jq in the same call: the reviews endpoint is array-shaped, so gh merges every page into one array before jq sees it. Combining the two would instead run the filter once per page and concatenate the per-page booleans, so any match past the first page would be missed.
          ALREADY=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate \
            | jq --arg sha "$HEAD_SHA" --arg who "$REVIEWER" \
                 '[.[] | select(.user.login == $who and .commit_id == $sha)] | length > 0')
          if [ "$ALREADY" = "true" ]; then
            skip "$REVIEWER has already reviewed $HEAD_SHA"
          fi

          # Everything that is not a new push (opened / reopened / ready_for_review) is review-worthy from here.
          if [ "$ACTION" != "synchronize" ]; then
            review "action=$ACTION"
          fi

          # From here it is a push, and the case worth skipping is GitHub's "Update branch" button, which merges the base branch into the pull request and introduces none of the author's own changes.
          PARENTS=$(gh api "repos/$REPO/commits/$AFTER" --jq '.parents[].sha' | tr '\n' ' ')
          read -r P1 P2 EXTRA <<< "$PARENTS"

          if [ -z "${P2:-}" ] || [ -n "${EXTRA:-}" ]; then
            review "head commit is not a two-parent merge"
          fi

          # A base merge keeps the previous head as its first parent. A force-push, rebase or squash does not, and any of those can change the author's own work.
          if [ "$P1" != "$BEFORE" ]; then
            review "first parent is not the previous head (force-push or rebase)"
          fi

          # The second parent must already be contained in the base branch, or this merged something other than the base.
          STATUS=$(gh api "repos/$REPO/compare/$P2...$BASE_REF" --jq '.status' 2>/dev/null || echo "unknown")
          case "$STATUS" in
            identical|ahead) ;;
            *) review "second parent is not an ancestor of $BASE_REF (status=$STATUS)" ;;
          esac

          # The "Update branch" button is only offered for a conflict-free merge, and GitHub commits the result itself. A merge pushed from a workstation looks identical in shape but can carry conflict resolutions -- real code, never reviewed -- so it is deliberately still reviewed.
          COMMITTER=$(gh api "repos/$REPO/commits/$AFTER" --jq '.commit.committer.name')
          if [ "$COMMITTER" != "GitHub" ]; then
            review "merge was committed by '$COMMITTER', not the Update branch button"
          fi

          skip "base branch merged in via the Update branch button; no new author changes"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.decide.outputs.should_review == 'true'
        with:
          # Full history: review mode's local git diff/log/show tools compare against the base branch, which a shallow (depth-1) clone does not have.
          fetch-depth: 0
      - uses: ExaDev/claude-code-action@v1
        if: steps.decide.outputs.should_review == 'true'
        with:
          mode: review
          # No github_token: leaving it unset is what makes the review run as the Claude Code App (claude[bot]). See the header comment.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Every other input is optional with a sensible default -- see action.yml for the full list.
