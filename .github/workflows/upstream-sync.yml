name: Upstream Sync

on:
  schedule:
    # Every Monday at 9 AM UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  upstream-sync:
    if: github.repository == 'ExaDev/claude-code-action'
    runs-on: ubuntu-latest
    steps:
      - name: Check for existing sync PR
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN_PRS=$(gh pr list \
            --repo "${{ github.repository }}" \
            --search "head:claude/upstream-sync" \
            --state open \
            --json number \
            --jq 'length')
          if [ "$OPEN_PRS" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping — open upstream-sync PR already exists."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.guard.outputs.skip != 'true'

      - name: Fetch upstream context
        id: fetch
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/upstream

          # Fetch upstream action.yml
          gh api repos/anthropics/claude-code-action/contents/action.yml \
            --jq '.content' | base64 -d > /tmp/upstream/action.yml

          # Fetch upstream README.md
          gh api repos/anthropics/claude-code-action/contents/README.md \
            --jq '.content' | base64 -d > /tmp/upstream/README.md

          # Fetch latest release info
          gh api repos/anthropics/claude-code-action/releases/latest \
            > /tmp/upstream/release.json

          # Fetch recent commits (last 30)
          gh api 'repos/anthropics/claude-code-action/commits?per_page=30' \
            > /tmp/upstream/commits.json

          echo "::notice::Upstream context fetched successfully."

      - name: Run Claude Code for sync analysis
        if: steps.guard.outputs.skip != 'true'
        uses: ./
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt_dir: upstream-sync
          claude_args: >-
            --max-turns 50
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh pr create:*),Bash(gh label create:*),Bash(cat:*),Bash(sort:*),Bash(comm:*),Bash(diff:*),Bash(echo:*),Bash(grep:*),Bash(date:*)"
