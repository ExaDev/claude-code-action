name: Claude Base

on:
  workflow_call:
    inputs:
      mode:
        description: 'Mode: interactive or review'
        required: false
        type: string
        default: 'interactive'
      pr_number:
        description: 'Pull request number (auto-set for code-review mode)'
        required: false
        type: string
        default: ''
      prompt_dir:
        description: 'Override prompt directory (default: claude for interactive, code-review for code-review)'
        required: false
        type: string
        default: ''
      claude_args:
        description: 'Override claude_args'
        required: false
        type: string
        default: ''
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

env:
  # Common tools for both modes
  COMMON_TOOLS: >-
    mcp__github__get_pull_request
    mcp__github__get_pull_request_files
    mcp__github__get_pull_request_diff
    mcp__github__get_pull_request_reviews
    mcp__github__list_pull_request_comments
    mcp__github__create_pending_pull_request_review
    mcp__github__add_comment_to_pending_review
    mcp__github__submit_pending_pull_request_review
    mcp__github__create_and_submit_pull_request_review
    Bash(gh pr comment:*)
    Bash(gh pr diff:*)
    Bash(gh pr view:*)
    Bash(gh pr edit:*)
    Bash(gh label *)
    Bash(gh api:*)
  # Interactive-only tools
  INTERACTIVE_TOOLS: >-
    Bash(gh issue comment:*)
    Bash(gh issue view:*)
  # Code-review-only tools
  REVIEW_TOOLS: >-
    Read
    Grep
    Glob
    Bash(git diff:*)
    Bash(git log:*)
    Bash(git blame:*)

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch shared prompts
        env:
          # Try ACTIONS_RUNTIME_TOKEN which may have access to the reusable workflow's repo
          GH_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
        run: |
          SHARED_REPO="adpeak/claude-code-action"
          mkdir -p .claude-shared/.github/prompts/shared
          mkdir -p .claude-shared/.github/prompts/interactive
          mkdir -p .claude-shared/.github/prompts/review
          mkdir -p .claude-shared/.github/scripts

          # Debug: show which token we're using (masked)
          echo "Using ACTIONS_RUNTIME_TOKEN for authentication"

          # Download prompt files using GitHub API
          download_dir() {
            local dir="$1"
            local target="$2"
            gh api "repos/$SHARED_REPO/contents/$dir" --paginate 2>/dev/null | \
              jq -r '.[] | select(.type == "file") | "\(.path)\t\(.sha)"' | \
              while IFS=$'\t' read -r path sha; do
                filename=$(basename "$path")
                echo "Downloading $path..."
                gh api "repos/$SHARED_REPO/contents/$path" --jq '.content' | \
                  base64 -d > "$target/$filename"
              done
          }

          # Download shared prompts
          download_dir ".github/prompts/shared" ".claude-shared/.github/prompts/shared"
          download_dir ".github/prompts/interactive" ".claude-shared/.github/prompts/interactive"
          download_dir ".github/prompts/review" ".claude-shared/.github/prompts/review"

          # Download compose-prompt.sh
          gh api "repos/$SHARED_REPO/contents/.github/scripts/compose-prompt.sh" --jq '.content' | \
            base64 -d > .claude-shared/.github/scripts/compose-prompt.sh
          chmod +x .claude-shared/.github/scripts/compose-prompt.sh

      - name: Set mode-specific defaults
        id: defaults
        run: |
          MODE="${{ inputs.mode }}"
          # Prompt directory
          if [ -n "${{ inputs.prompt_dir }}" ]; then
            PROMPT_DIR="${{ inputs.prompt_dir }}"
          elif [ "$MODE" = "review" ]; then
            PROMPT_DIR="review"
          else
            PROMPT_DIR="interactive"
          fi
          echo "prompt_dir=$PROMPT_DIR" >> "$GITHUB_OUTPUT"

          # Prompt env
          if [ "$MODE" = "review" ] && [ -n "${{ inputs.pr_number }}" ]; then
            echo "prompt_env=PR_NUMBER=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "prompt_env=" >> "$GITHUB_OUTPUT"
          fi

          # Claude args
          if [ -n "${{ inputs.claude_args }}" ]; then
            echo "claude_args=${{ inputs.claude_args }}" >> "$GITHUB_OUTPUT"
          else
            if [ "$MODE" = "code-review" ]; then
              TOOLS="${{ env.COMMON_TOOLS }} ${{ env.REVIEW_TOOLS }}"
            else
              TOOLS="${{ env.COMMON_TOOLS }} ${{ env.INTERACTIVE_TOOLS }}"
            fi
            # Convert to comma-separated single line
            TOOLS=$(echo "$TOOLS" | tr '\n' ' ' | tr -s ' ' | sed 's/ *,/,/g' | sed 's/^ *//;s/ *$//')
            echo "claude_args=--max-turns 50 --allowedTools \"$TOOLS\"" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose prompt
        id: compose-prompt
        env:
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          for pair in ${{ steps.defaults.outputs.prompt_env }}; do
            export "$pair"
          done
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "prompt<<$EOF" >> "$GITHUB_OUTPUT"
          .claude-shared/.github/scripts/compose-prompt.sh ${{ steps.defaults.outputs.prompt_dir }} .claude-shared >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Clean up shared prompts
        run: rm -rf .claude-shared

      - name: Run Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.compose-prompt.outputs.prompt }}
          claude_args: ${{ steps.defaults.outputs.claude_args }}
