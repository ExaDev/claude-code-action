name: Bidirectional Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get other repo URL and credentials
        id: repo
        run: |
          if [[ "${{ github.repository }}" == "ExaDev/claude-code-action" ]]; then
            # Syncing from ExaDev to adpeak - use adpeak's credentials
            echo "target=adpeak/claude-code-action" >> "$GITHUB_OUTPUT"
            echo "use_adpeak=true" >> "$GITHUB_OUTPUT"
            echo "token_step=token_adpeak" >> "$GITHUB_OUTPUT"
          else
            # Syncing from adpeak to ExaDev - use ExaDev's credentials
            echo "target=ExaDev/claude-code-action" >> "$GITHUB_OUTPUT"
            echo "use_adpeak=false" >> "$GITHUB_OUTPUT"
            echo "token_step=token_exadev" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App token (adpeak)
        if: steps.repo.outputs.use_adpeak == 'true'
        uses: tibdex/github-app-token@v2
        id: token_adpeak
        with:
          app_id: ${{ vars.ADPEAK_APP_ID }}
          private_key: ${{ secrets.ADPEAK_SYNC_PRIVATE_KEY }}
          installation_retrieval_mode: organization
          installation_retrieval_payload: adpeak

      - name: Generate GitHub App token (ExaDev)
        if: steps.repo.outputs.use_adpeak == 'false'
        uses: tibdex/github-app-token@v2
        id: token_exadev
        with:
          app_id: ${{ vars.EXADEV_APP_ID }}
          private_key: ${{ secrets.EXADEV_SYNC_PRIVATE_KEY }}
          installation_retrieval_mode: organization
          installation_retrieval_payload: ExaDev

      - name: Sync to other repo
        id: sync
        env:
          TARGET_REPO: ${{ steps.repo.outputs.target }}
          TARGET_TOKEN: ${{ steps[steps.repo.outputs.token_step].outputs.token }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          # Get timestamp for unique directory name
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          # Clone the target repo to work with it directly
          TARGET_URL="https://x-access-token:${TARGET_TOKEN}@github.com/${TARGET_REPO}.git"
          TARGET_DIR="/tmp/target-repo-${TIMESTAMP}"
          git clone "$TARGET_URL" "$TARGET_DIR"

          # Change to target repo directory
          cd "$TARGET_DIR"

          # Add the source repo as a remote to fetch its current state
          # Use GITHUB_TOKEN for source access since it has access to the repo where workflow runs
          SOURCE_URL="https://x-access-token:${{ github.token }}@github.com/${SOURCE_REPO}.git"
          git remote add source "$SOURCE_URL"
          git fetch source main

          # Fetch target's main to compare
          git fetch origin main

          # Count commits source has that target doesn't
          COMMITS_BEHIND=$(git log --oneline source/main ^origin/main | wc -l | tr -d ' ')

          echo "Commits we have that target doesn't: $COMMITS_BEHIND"

          if [[ "$COMMITS_BEHIND" -eq 0 ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Target repo is already up to date"
            exit 0
          fi

          # Configure git user
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Push source/main directly to origin/main
          # Use --force to handle divergent histories from previous PR-based syncs
          git push origin source/main:main --force

          echo "::notice::Synced main with ${COMMITS_BEHIND} commit(s) from ${SOURCE_REPO}"
