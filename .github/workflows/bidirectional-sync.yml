name: Bidirectional Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get other repo URL and credentials
        id: repo
        run: |
          if [[ "${{ github.repository }}" == "ExaDev/claude-code-action" ]]; then
            # Syncing from ExaDev to adpeak - use adpeak's credentials
            echo "target=adpeak/claude-code-action" >> "$GITHUB_OUTPUT"
            echo "use_adpeak=true" >> "$GITHUB_OUTPUT"
          else
            # Syncing from adpeak to ExaDev - use ExaDev's credentials
            echo "target=ExaDev/claude-code-action" >> "$GITHUB_OUTPUT"
            echo "use_adpeak=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub App token (adpeak)
        if: steps.repo.outputs.use_adpeak == 'true'
        uses: tibdex/github-app-token@v2
        id: token_adpeak
        with:
          app_id: ${{ vars.ADPEAK_APP_ID }}
          private_key: ${{ secrets.ADPEAK_SYNC_PRIVATE_KEY }}
          installation_retrieval_mode: organization
          installation_retrieval_payload: adpeak

      - name: Generate GitHub App token (ExaDev)
        if: steps.repo.outputs.use_adpeak == 'false'
        uses: tibdex/github-app-token@v2
        id: token_exadev
        with:
          app_id: ${{ vars.EXADEV_APP_ID }}
          private_key: ${{ secrets.EXADEV_SYNC_PRIVATE_KEY }}
          installation_retrieval_mode: organization
          installation_retrieval_payload: ExaDev

      - name: Sync to other repo
        id: sync
        env:
          TARGET_REPO: ${{ steps.repo.outputs.target }}
          TARGET_TOKEN: ${{ steps.token_adpeak.outputs.token }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          # Set up remote for target repo
          TARGET_URL="https://x-access-token:${TARGET_TOKEN}@github.com/${TARGET_REPO}.git"
          git remote add target "$TARGET_URL"

          # Debug: show the remote URL
          echo "=== Debug: Target URL (redacted token) ==="
          echo "${TARGET_URL/x-access-token:$TARGET_TOKEN@/x-access-token:***@}"
          echo "=== Debug: Git remote URLs ==="
          git remote -v

          # Fetch target's main to check if we're ahead
          git fetch target main

          # Count commits we have that target doesn't
          COMMITS_BEHIND=$(git log --oneline HEAD ^target/main | wc -l | tr -d ' ')

          echo "Commits we have that target doesn't: $COMMITS_BEHIND"

          if [[ "$COMMITS_BEHIND" -eq 0 ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Target repo is already up to date"
            exit 0
          fi

          # Get short SHA and timestamp for branch naming
          SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH_NAME="sync/${SOURCE_REPO}/${TIMESTAMP}-${SHA}"

          # Try to rebase our commits on top of target/main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rebase target/main 2>/dev/null; then
            # Rebase successful - but target repo requires PR, so create PR
            echo "skip_pr=false" >> "$GITHUB_OUTPUT"
            echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

            # Push the rebased branch
            git push "$TARGET_URL" HEAD:refs/heads/${BRANCH_NAME}
            echo "::notice::Successfully rebased ${COMMITS_BEHIND} commit(s). Created branch ${BRANCH_NAME} for PR."
          else
            # Rebase failed - abort and create PR
            git rebase --abort
            echo "skip_pr=false" >> "$GITHUB_OUTPUT"
            echo "branch_name=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"

            # Push the conflicting branch
            git push "$TARGET_URL" HEAD:refs/heads/${BRANCH_NAME}

            echo "::warning::Rebase conflict - created branch ${BRANCH_NAME} for manual resolution"
          fi

      - name: Create PR
        if: steps.sync.outputs.skip_pr == 'false'
        env:
          TARGET_TOKEN: ${{ steps.token_adpeak.outputs.token }}
          TARGET_REPO: ${{ steps.repo.outputs.target }}
          BRANCH: ${{ steps.sync.outputs.branch_name }}
          SOURCE: ${{ github.repository }}
        run: |
          export GH_TOKEN="${TARGET_TOKEN}"

          # Get commit count for PR description
          COMMITS=$(git log --oneline target/main..HEAD | wc -l | tr -d ' ')

          # Create PR
          gh pr create \
            --repo "${TARGET_REPO}" \
            --base main \
            --head "${BRANCH}" \
            --title "sync: merge changes from ${SOURCE}" \
            --body "Automatic sync from **${SOURCE}** with ${COMMITS} commit(s).

          ## Changes
          $(git log --oneline target/main..HEAD | head -10 | sed 's/^/- /')

          ---
          *Created automatically by bidirectional-sync workflow*"

          echo "::notice::Created PR for ${COMMITS} commit(s) from ${SOURCE}"

      - name: Cleanup old sync branches
        if: steps.sync.outputs.skip != 'true'
        env:
          TARGET_TOKEN: ${{ steps.token_adpeak.outputs.token }}
          TARGET_REPO: ${{ steps.repo.outputs.target }}
        run: |
          export GH_TOKEN="${TARGET_TOKEN}"
          SEVEN_DAYS_AGO=$(python3 -c 'from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc) - timedelta(days=7)).strftime("%Y-%m-%dT%H:%M:%SZ"))')

          # Delete sync branches older than 7 days
          gh api repos/${TARGET_REPO}/git/refs/heads --paginate --jq '.[].ref' |
            grep -E 'refs/heads/sync/' | while read -r ref; do
              branch=${ref#refs/heads/}
              # Get commit date safely
              commit_date=$(gh api repos/${TARGET_REPO}/git/refs/heads/${branch} --jq '.object.sha' | xargs -I {} gh api repos/${TARGET_REPO}/git/commits/{} --jq '.author.date' 2>/dev/null || echo "")

              if [[ -n "$commit_date" ]]; then
                # Compare dates using Python for portability
                is_old=$(python3 -c "from datetime import datetime; d = datetime.fromisoformat('$commit_date'.replace('Z', '+00:00')); print(d < datetime.fromisoformat('$SEVEN_DAYS_AGO').replace(tzinfo=d.tzinfo))")
                if [[ "$is_old" == "True" ]]; then
                  # Check for open PRs before deleting
                  if gh pr list --repo ${TARGET_REPO} --head ${branch} --json number --jq 'length' | grep -q '^0$'; then
                    if gh api --method DELETE repos/${TARGET_REPO}/git/refs/heads/${branch} 2>/dev/null; then
                      echo "Deleted old branch: $branch"
                    else
                      echo "::warning::Failed to delete branch: $branch"
                    fi
                  else
                    echo "::notice::Skipping branch with open PR: $branch"
                  fi
                fi
              fi
            done
