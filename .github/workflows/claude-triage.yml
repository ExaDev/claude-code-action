name: Claude Issue Triage

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  claude-triage:
    # Run on new issues, or when 'needs-triage' label is applied
    if: >
      (github.event.action == 'opened' &&
       github.event.issue.user.type != 'Bot') ||
      (github.event.action == 'labeled' &&
       github.event.label.name == 'needs-triage')
    # blacksmith-4vcpu-ubuntu-2404, not ExaDev's own self-hosted fleet: this job invokes Claude Code's own agentic execution (real Bash access within its tool allowlist), and the fleet is a persistent machine shared across every other ExaDev repo's CI -- an ephemeral per-job VM is the safer place for that, matching ExaDev/dex's own claude-review.yml, which makes the same choice for the same reason.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          mode: triage
          issue_number: ${{ github.event.issue.number }}
          claude_code_oauth_token: |
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_BACKUP }}
          # Optional: Change the re-triage label (must also update the `if:` condition above to match)
          # triage_label: "needs-triage"
          # Optional: Disable issue body updates
          # update_issue_body: false
