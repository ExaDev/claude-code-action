name: Claude Interactive

# Reusable workflow: interactive @claude assistance in issue and pull request comments.
#
# A calling repository decides *when* this runs. Its own workflow supplies the comment triggers and calls this one from a job. See examples/claude-interactive.yml in this repository for a caller to copy.

on:
  workflow_call:
    inputs:
      trigger_phrase:
        description: "Phrase in a comment that invokes Claude."
        type: string
        required: false
        default: "@claude"
      allowed_non_write_users:
        description: |
          Comma-separated usernames allowed to invoke Claude without repository write access, or '*' for all.
          Empty (the default) means only users with write access can trigger a run, which is what you want.

          Widening this is a deliberate per-repository choice, not a default. This mode can edit code, push a
          branch, and open a pull request, so granting it to users without write access effectively hands them
          write access by proxy, via text that the model interprets. Do not set it to '*' here. If you need
          Claude to respond to reporters without write access, use triage mode instead, which holds no write
          scope. See the security notes in this action's README.
        type: string
        required: false
        default: ""
      model:
        description: "Model passed to Claude Code as --model: an alias (sonnet, opus, haiku) or a full model name. Defaults to sonnet."
        type: string
        required: false
        default: "sonnet"
      resume_sessions:
        description: "Cache and resume Claude Code sessions across runs. On by default."
        type: boolean
        required: false
        default: true
      settings:
        description: "Claude Code settings: a JSON string, or a path to a settings file in the calling repository."
        type: string
        required: false
        default: ""
      extra_claude_args:
        description: "Extra Claude Code CLI arguments, appended to the ones this workflow derives."
        type: string
        required: false
        default: ""
      allowed_bots:
        description: "Comma-separated bot usernames allowed to invoke Claude, or '*' for all. Empty allows none."
        type: string
        required: false
        default: ""
      track_progress:
        description: "Post a visible progress-tracking comment while Claude works — most useful here, where a human is waiting on a response."
        type: boolean
        required: false
        default: false
      use_sticky_comment:
        description: "Deliver responses through one continuously-updated comment instead of a new one each time."
        type: boolean
        required: false
        default: false
      post_progress_comment:
        description: "Post a plain 'Claude is working on this' comment before the run starts, then edit it once finished. Independent of track_progress/use_sticky_comment above, which need upstream's tag mode and never apply to this workflow's own agent-mode run. On by default."
        type: boolean
        required: false
        default: true
      include_comments_by_actor:
        description: "Comma-separated actor usernames to include as context (supports '*[bot]' wildcards). Empty includes all actors."
        type: string
        required: false
        default: ""
      exclude_comments_by_actor:
        description: "Comma-separated actor usernames to exclude from context (supports '*[bot]' wildcards). Empty excludes none. Worth excluding bot-authored comments here specifically, given untrusted comment text already reaches the model in this mode."
        type: string
        required: false
        default: ""
      base_branch:
        description: "Base branch for a Claude-created branch. Defaults to the repository's default branch."
        type: string
        required: false
        default: ""
      branch_prefix:
        description: "Prefix for a Claude-created branch. Do not default this to an empty string — it would override upstream's own 'claude/' default with no prefix at all."
        type: string
        required: false
        default: "claude/"
      branch_name_template:
        description: "Template for a Claude-created branch's name. See action.yml's description for the available variables. Empty uses the upstream default template."
        type: string
        required: false
        default: ""
      use_commit_signing:
        description: "Sign commits using GitHub's own commit signature verification (no key management required). Optional — off by default, and ignored if ssh_signing_key is set."
        type: boolean
        required: false
        default: false
      bot_id:
        description: "GitHub user ID to use for git commit authorship. Defaults to Claude's own bot ID — do not default this to an empty string, which would override that default with a blank identity end-to-end."
        type: string
        required: false
        default: "41898282"
      bot_name:
        description: "GitHub username to use for git commit authorship. Defaults to Claude's own bot name — do not default this to an empty string, for the same reason as bot_id."
        type: string
        required: false
        default: "claude[bot]"
      plugins:
        description: "Newline-separated Claude Code plugin names to install before responding."
        type: string
        required: false
        default: ""
      plugin_marketplaces:
        description: "Newline-separated plugin marketplace Git URLs to install plugins from."
        type: string
        required: false
        default: ""
      use_bedrock:
        description: "Use Amazon Bedrock instead of the direct Anthropic API. Needs AWS credentials in this job's own environment. OIDC-based Bedrock auth needs id-token: write, which cannot be granted from a job calling this reusable workflow — call the composite action directly for that instead."
        type: boolean
        required: false
        default: false
      use_vertex:
        description: "Use Google Vertex AI instead of the direct Anthropic API. Needs GCP credentials in this job's own environment. Same id-token: write caveat as use_bedrock."
        type: boolean
        required: false
        default: false
      use_foundry:
        description: "Use Microsoft Foundry instead of the direct Anthropic API. Needs Foundry configuration in this job's own environment. Same id-token: write caveat as use_bedrock."
        type: boolean
        required: false
        default: false
      anthropic_federation_rule_id:
        description: "Workload identity federation rule ID (fdrl_...). Requires id-token: write — see the use_bedrock note."
        type: string
        required: false
        default: ""
      anthropic_organization_id:
        description: "Anthropic organisation UUID for workload identity federation."
        type: string
        required: false
        default: ""
      anthropic_service_account_id:
        description: "Service account ID (svac_...) the federated token acts as."
        type: string
        required: false
        default: ""
      anthropic_workspace_id:
        description: "Workspace ID (wrkspc_...) for workload identity federation."
        type: string
        required: false
        default: ""
      anthropic_oidc_audience:
        description: "Audience to request on the GitHub OIDC token for workload identity federation."
        type: string
        required: false
        default: ""
      display_report:
        description: "Display the Claude Code report in the GitHub Step Summary. Only for trusted-input repositories — see action.yml's own warning."
        type: boolean
        required: false
        default: false
      show_full_output:
        description: "Show full JSON output from Claude Code. May contain secrets — debugging only, in non-sensitive contexts."
        type: boolean
        required: false
        default: false
      runs_on:
        description: "Runner label for the job."
        type: string
        required: false
        default: "ubuntu-latest"
      timeout_minutes:
        description: "Job timeout."
        type: number
        required: false
        default: 30
    secrets:
      anthropic_api_key:
        description: "Anthropic API key. Supply this or claude_code_oauth_token."
        required: false
      claude_code_oauth_token:
        description: "Claude Code OAuth token. Supply this or anthropic_api_key."
        required: false
      ssh_signing_key:
        description: "SSH private key to sign commits with. Optional — a secret because it is a private key, unlike use_commit_signing which needs no key. Leave unset for plain git commits or GitHub-verified commit signing (use_commit_signing)."
        required: false

jobs:
  interactive:
    name: Interactive
    # The trigger phrase is gated here, in the job condition, and this is load-bearing. Supplying a prompt puts the underlying action into its agent mode, which runs unconditionally and does not itself check for the phrase. Without this condition every single comment on every issue and pull request would start a paid run.
    #
    # Guards against a bot's own comment/review text containing the literal trigger phrase -- confirmed directly on novus-power/hive (commit f509aa9a64): Anthropic's native Claude Code Review GitHub App posts a boilerplate "Comment @claude review for a one-time review..." notice on every pull request when its own automatic review is set to manual, and that boilerplate's own "@claude review" substring satisfied a default-phrase trigger from the bot's own submission -- wasting a full checkout, Claude Code install, and OIDC/App token exchange before any downstream actor check caught it.
    #
    # inputs.allowed_bots stays reachable through this guard rather than being shadowed by it: '*' allows any bot sender through, and a comma-separated list is checked by exact entry (padded with commas on both sides so a login that is merely a substring of another entry's name can't false-match). A caller that wants a specific trusted bot -- one it configures deliberately, not the accidental case above -- still can.
    if: |
      (
        github.event.sender.type != 'Bot'
        || inputs.allowed_bots == '*'
        || contains(format(',{0},', inputs.allowed_bots), format(',{0},', github.event.sender.login))
      ) && (
        (
          (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
          && contains(github.event.comment.body, inputs.trigger_phrase)
        ) || (
          github.event_name == 'pull_request_review'
          && contains(github.event.review.body, inputs.trigger_phrase)
        )
      )
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    # Interactive mode may need to commit a fix to a new branch and open a pull request for it, so it holds write scopes the other two modes do not. It is the reason `allowed_non_write_users` should stay unset here. Branch protection on the default branch is the control that stops `contents: write` becoming a direct push.
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so a branch can be created and pushed from a sensible base.
          fetch-depth: 0

      - name: Respond to request
        uses: ./
        with:
          mode: interactive
          trigger_phrase: ${{ inputs.trigger_phrase }}
          allowed_non_write_users: ${{ inputs.allowed_non_write_users }}
          model: ${{ inputs.model }}
          settings: ${{ inputs.settings }}
          resume_sessions: ${{ inputs.resume_sessions }}
          extra_claude_args: ${{ inputs.extra_claude_args }}
          allowed_bots: ${{ inputs.allowed_bots }}
          track_progress: ${{ inputs.track_progress }}
          use_sticky_comment: ${{ inputs.use_sticky_comment }}
          post_progress_comment: ${{ inputs.post_progress_comment }}
          include_comments_by_actor: ${{ inputs.include_comments_by_actor }}
          exclude_comments_by_actor: ${{ inputs.exclude_comments_by_actor }}
          base_branch: ${{ inputs.base_branch }}
          branch_prefix: ${{ inputs.branch_prefix }}
          branch_name_template: ${{ inputs.branch_name_template }}
          use_commit_signing: ${{ inputs.use_commit_signing }}
          bot_id: ${{ inputs.bot_id }}
          bot_name: ${{ inputs.bot_name }}
          plugins: ${{ inputs.plugins }}
          plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
          use_bedrock: ${{ inputs.use_bedrock }}
          use_vertex: ${{ inputs.use_vertex }}
          use_foundry: ${{ inputs.use_foundry }}
          anthropic_federation_rule_id: ${{ inputs.anthropic_federation_rule_id }}
          anthropic_organization_id: ${{ inputs.anthropic_organization_id }}
          anthropic_service_account_id: ${{ inputs.anthropic_service_account_id }}
          anthropic_workspace_id: ${{ inputs.anthropic_workspace_id }}
          anthropic_oidc_audience: ${{ inputs.anthropic_oidc_audience }}
          display_report: ${{ inputs.display_report }}
          show_full_output: ${{ inputs.show_full_output }}
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          ssh_signing_key: ${{ secrets.ssh_signing_key }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
