name: Test Main Push

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate adpeak GitHub App token
        uses: tibdex/github-app-token@v2
        id: token
        with:
          app_id: ${{ vars.ADPEAK_APP_ID }}
          private_key: ${{ secrets.ADPEAK_SYNC_PRIVATE_KEY }}
          installation_retrieval_mode: organization
          installation_retrieval_payload: adpeak

      - name: Clone adpeak repo and try pushing to main
        env:
          TARGET_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          echo "=== Cloning adpeak repo ==="
          git clone https://x-access-token:${TARGET_TOKEN}@github.com/adpeak/claude-code-action.git /tmp/adpeak-repo

          echo ""
          echo "=== Making a change ==="
          cd /tmp/adpeak-repo
          echo "test $(date)" > test-file.txt
          git add test-file.txt
          git config user.name "Test"
          git config user.email "test@test.com"
          git commit -m "test commit"

          echo ""
          echo "=== Trying to push to main ==="
          git push origin HEAD:main -f || echo "Push to main failed: $?"

          echo ""
          echo "=== Trying to push to a test branch ==="
          git push origin HEAD:test-push-to-main-$(date +%s) || echo "Push to test branch failed: $?"