name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

permissions:
  # contents: write, not read -- interactive mode commits to a branch and pushes it. This was previously (incorrectly) contents: read, which would have failed the moment interactive mode actually tried to push, caught while comparing against the reusable interactive workflow's own (correctly-scoped) permissions block during the pre-public consolidation pass.
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: >
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      || (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    # blacksmith-4vcpu-ubuntu-2404, not ExaDev's own self-hosted fleet: this job invokes Claude Code's own agentic execution (real Bash access within its tool allowlist), and the fleet is a persistent machine shared across every other ExaDev repo's CI -- an ephemeral per-job VM is the safer place for that, matching ExaDev/dex's own claude-review.yml, which makes the same choice for the same reason.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          mode: interactive
          claude_code_oauth_token: |
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_BACKUP }}
          # Optional: Customize trigger phrase
          # trigger_phrase: "/claude"
          # Optional: Enable progress tracking
          # track_progress: true
