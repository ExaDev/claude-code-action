name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

permissions:
  # contents: write, not read -- interactive mode commits to a branch and pushes it. This was previously (incorrectly) contents: read, which would have failed the moment interactive mode actually tried to push, caught while comparing against the reusable interactive workflow's own (correctly-scoped) permissions block during the pre-public consolidation pass.
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    # Each branch below excludes bot-authored content before matching the trigger phrase -- confirmed directly on novus-power/hive (commit f509aa9a64): Anthropic's native Claude Code Review GitHub App posts a boilerplate "Comment @claude review for a one-time review..." notice on every pull request when its own automatic review is set to manual, and that boilerplate's own "@claude review" substring satisfied this trigger from the bot's own submission -- wasting a full checkout, Claude Code install, and OIDC/App token exchange before anything downstream caught it.
    #
    # The comment/review branches check github.event.sender.type -- for an issue_comment/pull_request_review_comment/pull_request_review event, sender is the actor who posted that comment or review, so it is the right field. The issues branch deliberately checks github.event.issue.user.type instead, not sender: this branch also fires on assigned/labeled, where sender is whoever performed that action, not who opened the issue -- a human labelling an issue a bot opened would otherwise pass a sender-based check while the issue body (still bot-authored) still matches the trigger phrase.
    if: >
      (github.event_name == 'issue_comment' && github.event.sender.type != 'Bot' && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review_comment' && github.event.sender.type != 'Bot' && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review' && github.event.sender.type != 'Bot' && contains(github.event.review.body, '@claude'))
      || (github.event_name == 'issues' && github.event.issue.user.type != 'Bot' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          mode: interactive
          claude_code_oauth_token: |
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_BACKUP }}
          # Optional: Customize trigger phrase
          # trigger_phrase: "/claude"
          # Optional: Enable progress tracking
          # track_progress: true
