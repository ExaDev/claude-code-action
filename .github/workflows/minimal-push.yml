name: Minimal Push Test

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate adpeak GitHub App token
        uses: tibdex/github-app-token@v2
        id: token
        with:
          app_id: ${{ vars.ADPEAK_APP_ID }}
          private_key: ${{ secrets.ADPEAK_SYNC_PRIVATE_KEY }}
          installation_retrieval_mode: organization
          installation_retrieval_payload: adpeak

      - name: Test push to adpeak repo
        env:
          TARGET_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          echo "Testing push to adpeak/claude-code-action..."

          # Add the adpeak repo as a remote
          git remote add adpeak "https://x-access-token:${TARGET_TOKEN}@github.com/adpeak/claude-code-action.git"

          # Try to push current HEAD to main
          echo "Attempting: git push adpeak HEAD:main"
          git push adpeak HEAD:main || echo "Push failed with code: $?"

          echo ""
          echo "=== Remote URLs ==="
          git remote -v

          echo ""
          echo "=== Testing with verbose output ==="
          GIT_TRACE=1 GIT_CURL_VERBOSE=1 git push adpeak HEAD:main 2>&1 | head -50 || true
