name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# determine-runner routes every job below through ExaDev's self-hosted fleet, falling back to ubuntu-latest via ExaDev/runner-fallback-action -- which reads a secret gist refreshed by the fleet's heartbeat. No token, no secret, no per-repo setup. The Dependabot/fork-PR guard (force ubuntu-latest so untrusted code never runs on the fleet) lives inside the action. TEMPORARILY runs-on exadev-runners directly (not ubuntu-latest) rather than through the fallback action itself, because ExaDev's GitHub-hosted runners are blocked by an account billing issue -- revert to ubuntu-latest once billing clears, which activates the real fallback. The action is pinned to a commit SHA, not @main; bump deliberately when it changes (b774d51 = the secret-gist redesign). Matches the pattern already in use on ExaDev/Exie and ExaDev/dex's own ci.yml.
#
# exadev-runners is linux-arm64 (an Apple Silicon host), not linux-amd64 like ubuntu-latest -- confirmed live via a recent Exie CI run's own setup-node log. actionlint's install step below picks the matching release asset for whichever architecture it actually lands on, rather than assuming amd64.
jobs:
  determine-runner:
    runs-on: exadev-runners
    timeout-minutes: 5
    outputs:
      selected-runner: ${{ steps.fallback.outputs.selected-runner || '["ubuntu-latest"]' }}
      preferred-available: ${{ steps.fallback.outputs.preferred-available || 'false' }}
    steps:
      - id: fallback
        uses: ExaDev/runner-fallback-action@b774d51ff5360bf53705b2eb34ff019afd4d7f07

  commitlint:
    name: Commitlint
    # The local commit-msg hook (.husky/commit-msg) can be bypassed -- a merge via the GitHub web UI, a commit from a tool that doesn't run hooks. This checks every commit on a pull request against the same rules. Nothing to check on a plain push to main: those commits already passed this exact job on their pull request.
    if: github.event_name == 'pull_request'
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  actionlint:
    name: Actionlint
    # No action wrapper: actionlint is a self-contained static binary. Download the pinned release directly and verify its checksum, rather than trusting a third-party action.yml (rhysd/actionlint has none anyway) or an unpinned install script. actionlint only understands workflow files (.github/workflows/*.yml), not this repo's own composite action.yml -- see the README's own note on how action.yml's runs.steps are instead validated (a synthetic workflow_call wrapper, checked by hand during review, not by this job).
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256_AMD64: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      ACTIONLINT_SHA256_ARM64: "325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install actionlint
        # Picks the release asset matching the actual runner architecture (amd64 on ubuntu-latest, arm64 on exadev-runners) rather than assuming one -- see the file header comment.
        run: |
          case "$(uname -m)" in
            x86_64) ARCH=amd64; SHA256="${ACTIONLINT_SHA256_AMD64}" ;;
            aarch64|arm64) ARCH=arm64; SHA256="${ACTIONLINT_SHA256_ARM64}" ;;
            *) echo "::error::Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          curl -sLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_${ARCH}.tar.gz"
          echo "${SHA256}  actionlint_${ACTIONLINT_VERSION}_linux_${ARCH}.tar.gz" | sha256sum -c -
          tar xzf "actionlint_${ACTIONLINT_VERSION}_linux_${ARCH}.tar.gz" actionlint
      - run: ./actionlint -color

  # typecheck/lint/format each route through `turbo run <task>` rather than a plain `npm run` so a rerun with nothing relevant changed (a docs-only push, a rerun after an unrelated job failed) completes from cache instead of re-executing tsc/eslint/prettier from scratch.
  typecheck:
    name: Typecheck
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx turbo run typecheck

  lint:
    name: Lint
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx turbo run lint

  format:
    name: Format
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx turbo run format:check

  # A single stable branch-protection target aggregating every job that runs on every pull request, so the required status check doesn't need updating in GitHub's branch protection settings whenever a job is added, renamed, or split -- only this job's own needs: list changes, in the same commit as whatever job it now covers. if: always() so this job still runs (and can fail) even when one of its dependencies failed outright, rather than being skipped itself; a dependency that never ran for this event (commitlint on a plain push to main) reports "skipped", not "failure" or "cancelled", so it doesn't block release below.
  required-checks:
    name: Required Checks
    if: always()
    needs: [determine-runner, commitlint, actionlint, typecheck, lint, format]
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for result in $results; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              exit 1
            fi
          done

  # Computes the next version from commits since the last tag, generates release notes and a CHANGELOG.md entry, creates the GitHub Release and version tag, commits CHANGELOG.md back to main, and (via the move-major-tag plugin in release.config.ts) moves the moving vN tag to point at the new release -- see release.config.ts and scripts/move-major-tag.mjs. There is no npm-publish step and therefore no id-token: write permission -- this repository ships a GitHub Action, not an npm package.
  release:
    name: Release
    needs: [determine-runner, required-checks]
    # A bare `github.ref == ... && github.event_name == ...` here would look sufficient but isn't: without one of always()/success()/failure()/cancelled(), GitHub implicitly ANDs the condition with success() evaluated over the *entire* transitive job graph, not just needs: [required-checks] -- and commitlint (an ancestor via required-checks, skipped by its own `if:` on every push to main) reports "skipped", which fails that implicit check even though required-checks itself passed. always() plus an explicit check of required-checks' own result is what actually asks "did the one job I depend on succeed", ignoring how it got there.
    if: always() && needs.required-checks.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    timeout-minutes: 10
    permissions:
      contents: write # to create the GitHub Release; actual git pushes below authenticate as the ExaDev sync App instead, not this job token
      issues: write # to comment on released issues
      pull-requests: write # to comment on released pull requests
    steps:
      # The default job token's github-actions[bot] identity can never bypass branch protection, by GitHub's own design (a deliberate anti-privilege-escalation restriction, not something any permissions: grant can lift) -- so wherever branch protection exists on main, its push of the CHANGELOG.md/tag commit needs a bypass identity. This repository's own sync App (vars.EXADEV_APP_ID/secrets.EXADEV_SYNC_PRIVATE_KEY) has already pushed directly to this repo's own main before, via the bidirectional-sync workflow this repository used to run before its consolidation pass -- confirming that App already has contents: write here -- so it's reused rather than provisioning a second App for the same purpose. As of this repository going through the pre-public consolidation pass, it has no branch protection at all (a GitHub Free private-repo plan limitation -- the rulesets/branch-protection APIs both 403 with "Upgrade to GitHub Pro or make this repository public"), so this bypass identity is not load-bearing yet; it is wired up now so nothing needs to change the day branch protection is actually configured, matching the App-bypass pattern a protected main branch needs regardless of which repository runs it.
      - name: Mint ExaDev sync App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.EXADEV_APP_ID }}
          private-key: ${{ secrets.EXADEV_SYNC_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          # semantic-release analyses the full commit history since the last tag.
          fetch-depth: 0
          # actions/checkout wires this into git's own credential config, so every subsequent plain `git push` in this job (the version tag, the CHANGELOG.md commit, and move-major-tag.mjs's tag move) authenticates as the App, not just this one checkout.
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Release
        # HUSKY=0 so the commit-msg hook never fires against the automated release commit.
        run: HUSKY=0 npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
