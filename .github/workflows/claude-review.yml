name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude-review:
    # Skip draft PRs; allow claude[bot] but skip other bots
    if: >
      (github.event.pull_request.user.type != 'Bot' ||
       github.event.pull_request.user.login == 'claude[bot]') &&
      github.event.pull_request.draft == false
    # blacksmith-4vcpu-ubuntu-2404, not ExaDev's own self-hosted fleet: this job invokes Claude Code's own agentic execution (real Bash access within its tool allowlist), and the fleet is a persistent machine shared across every other ExaDev repo's CI -- an ephemeral per-job VM is the safer place for that, matching ExaDev/dex's own claude-review.yml, which makes the same choice for the same reason.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          mode: review
          pr_number: ${{ github.event.pull_request.number }}
          claude_code_oauth_token: |
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
            ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_BACKUP }}
          allowed_bots: "claude[bot]"
          # Optional: Enable progress tracking with checkboxes
          # track_progress: true
          # Optional: Include "Fix this" links (default: true)
          # include_fix_links: true
