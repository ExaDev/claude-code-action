name: Claude PR Review

# Reusable workflow: automated pull-request review.
#
# A calling repository decides *when* this runs. Its own workflow supplies the `on: pull_request:` trigger and calls this one from a job. See examples/claude-review.yml in this repository for a caller to copy.

on:
  workflow_call:
    inputs:
      include_ci_logs:
        description: "Let the review read this pull request's failing CI logs."
        type: boolean
        required: false
        default: false
      review_drafts:
        description: "Review draft pull requests too. Off by default, so a draft is reviewed when it is marked ready."
        type: boolean
        required: false
        default: false
      severity_ratings:
        description: "Whether findings also carry an emoji severity rating (🔴 Blocker, 🟠 Should fix, 🟡 Nit): 'always', 'optional', or 'never'. 'optional' (the default) leaves it to the model's own judgement per finding."
        type: string
        required: false
        default: "optional"
      allowed_review_states:
        description: "Comma-separated subset of changes_requested, comment, approve. Default allows all three (a clean review is approved, which can satisfy a required-review rule). comment is always available as the truthful fallback."
        type: string
        required: false
        default: "changes_requested,comment,approve"
      include_suggestions:
        description: "Whether review comments carry apply-able GitHub suggestion blocks for findings with a drop-in fix. On by default; false for prose-only reviews."
        type: boolean
        required: false
        default: true
      resolve_stale_threads:
        description: "On a re-review, resolve the bot's prior threads the new revision has addressed. On by default; widens the allowlist (adds gh api:*), so set false on repos accepting untrusted fork PRs."
        type: boolean
        required: false
        default: true
      fix_pr_metadata:
        description: "Correct the pull request's own title and description directly when they're vague, empty, or an unfilled template. On by default; adds a direct write to the PR's title/body, so set false on repos accepting untrusted fork PRs."
        type: boolean
        required: false
        default: true
      verify_prior_findings:
        description: "On a re-review, re-check a past finding's technical claims (does an API exist, how is it used, what version supports it) before trusting it again, rather than just checking whether the code changed. On by default; adds unrestricted WebFetch to the allowlist, so set false on repos accepting untrusted fork PRs."
        type: boolean
        required: false
        default: true
      structured_review_summary:
        description: "Run a bounded follow-up call after the review that re-fetches it and produces a structured_output JSON summary (review_state, finding counts). Off by default, unlike the other review toggles: costs a second call every review, worth it only if you read structured_output. Needs Bash(gh api:*) to read inline comments, so set false on repos accepting untrusted fork PRs too."
        type: boolean
        required: false
        default: false
      fix_ci_failures:
        description: "After the review, resume the session and apply a confident fix for this pull request's failing CI, commit it, and push it to the PR branch. Off by default. Requires include_ci_logs: true. NO-OP THROUGH THIS WORKFLOW: the permissions block below is hardcoded to contents: read and cannot branch on an input, so the push is impossible and the whole pass is skipped before it costs a call. Exposed for parity; use the direct form (examples/direct/claude-review-with-fixes.yml) if you want fixes applied."
        type: boolean
        required: false
        default: false
      fix_diff_findings:
        description: "Same follow-up pass as fix_ci_failures, acting on the review's own Blocker and Should-fix findings rather than on CI. Off by default. Same no-op through this workflow, for the same reason."
        type: boolean
        required: false
        default: false
      add_regression_tests:
        description: "Add a regression test alongside each fix the pass applies. Off by default; requires at least one of fix_ci_failures and fix_diff_findings. Same no-op through this workflow."
        type: boolean
        required: false
        default: false
      resume_sessions:
        description: "Cache and resume Claude Code sessions across runs for the same PR/issue/branch. On by default."
        type: boolean
        required: false
        default: true
      model:
        description: "Model passed to Claude Code as --model: an alias (sonnet, opus, haiku) or a full model name. Defaults to sonnet."
        type: string
        required: false
        default: "sonnet"
      settings:
        description: "Claude Code settings: a JSON string, or a path to a settings file in the calling repository."
        type: string
        required: false
        default: ""
      extra_claude_args:
        description: "Extra Claude Code CLI arguments, appended to the ones this workflow derives."
        type: string
        required: false
        default: ""
      allowed_bots:
        description: "Comma-separated bot usernames whose pull requests may be reviewed, or '*' for all. Empty allows none."
        type: string
        required: false
        default: ""
      track_progress:
        description: "Post a visible progress-tracking comment while the review runs."
        type: boolean
        required: false
        default: false
      use_sticky_comment:
        description: "Deliver review comments through one continuously-updated comment instead of a new one each run."
        type: boolean
        required: false
        default: false
      post_progress_comment:
        description: "Post a plain 'Claude is reviewing this pull request' comment before the run starts, then edit it once finished. Independent of track_progress/use_sticky_comment above, which need upstream's tag mode and never apply to this workflow's own agent-mode run. On by default."
        type: boolean
        required: false
        default: true
      include_fix_links:
        description: "Include 'Fix this' links in review findings."
        type: boolean
        required: false
        default: true
      classify_inline_comments:
        description: "Buffer inline comments without confirmed=true and classify them (real review vs test/probe) before posting after the session ends. False posts all inline comments immediately (pre-buffering behavior)."
        type: boolean
        required: false
        default: true
      include_comments_by_actor:
        description: "Comma-separated actor usernames to include as context (supports '*[bot]' wildcards). Empty includes all actors."
        type: string
        required: false
        default: ""
      exclude_comments_by_actor:
        description: "Comma-separated actor usernames to exclude from context (supports '*[bot]' wildcards). Empty excludes none."
        type: string
        required: false
        default: ""
      bot_id:
        description: "GitHub user ID to use for git commit authorship, if the review ever needs one. Defaults to Claude's own bot ID — do not default this to an empty string, which would override that default with a blank identity end-to-end."
        type: string
        required: false
        default: "41898282"
      bot_name:
        description: "GitHub username to use for git commit authorship, if the review ever needs one. Defaults to Claude's own bot name — do not default this to an empty string, for the same reason as bot_id."
        type: string
        required: false
        default: "claude[bot]"
      plugins:
        description: "Newline-separated Claude Code plugin names to install before the review."
        type: string
        required: false
        default: ""
      plugin_marketplaces:
        description: "Newline-separated plugin marketplace Git URLs to install plugins from."
        type: string
        required: false
        default: ""
      use_bedrock:
        description: "Use Amazon Bedrock instead of the direct Anthropic API. Needs AWS credentials in this job's own environment. OIDC-based Bedrock auth needs id-token: write, which cannot be granted from a job calling this reusable workflow — call the composite action directly for that instead."
        type: boolean
        required: false
        default: false
      use_vertex:
        description: "Use Google Vertex AI instead of the direct Anthropic API. Needs GCP credentials in this job's own environment. Same id-token: write caveat as use_bedrock."
        type: boolean
        required: false
        default: false
      use_foundry:
        description: "Use Microsoft Foundry instead of the direct Anthropic API. Needs Foundry configuration in this job's own environment. Same id-token: write caveat as use_bedrock."
        type: boolean
        required: false
        default: false
      anthropic_federation_rule_id:
        description: "Workload identity federation rule ID (fdrl_...). Requires id-token: write — see the use_bedrock note."
        type: string
        required: false
        default: ""
      anthropic_organization_id:
        description: "Anthropic organisation UUID for workload identity federation."
        type: string
        required: false
        default: ""
      anthropic_service_account_id:
        description: "Service account ID (svac_...) the federated token acts as."
        type: string
        required: false
        default: ""
      anthropic_workspace_id:
        description: "Workspace ID (wrkspc_...) for workload identity federation."
        type: string
        required: false
        default: ""
      anthropic_oidc_audience:
        description: "Audience to request on the GitHub OIDC token for workload identity federation."
        type: string
        required: false
        default: ""
      display_report:
        description: "Display the Claude Code report in the GitHub Step Summary. Only for trusted-input repositories — see action.yml's own warning."
        type: boolean
        required: false
        default: false
      show_full_output:
        description: "Show full JSON output from Claude Code. May contain secrets — debugging only, in non-sensitive contexts."
        type: boolean
        required: false
        default: false
      fetch_depth:
        description: "Checkout depth. 0 fetches full history, which local git comparisons against the base branch need."
        type: number
        required: false
        default: 0
      runs_on:
        description: "Runner label for the job."
        type: string
        required: false
        default: "ubuntu-latest"
      timeout_minutes:
        description: "Job timeout."
        type: number
        required: false
        default: 20
    secrets:
      anthropic_api_key:
        description: "Anthropic API key. Supply this or claude_code_oauth_token."
        required: false
      claude_code_oauth_token:
        description: "Claude Code OAuth token. Supply this or anthropic_api_key."
        required: false

jobs:
  review:
    name: Review
    # A draft is usually mid-thought, and reviewing every push to one wastes budget and attention. The default caller trigger includes `ready_for_review`, so a draft gets reviewed when its author marks it ready.
    if: inputs.review_drafts || github.event.pull_request.draft == false
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    # Least privilege for a reviewer: read the code, write comments, nothing else. `actions: read` is here solely so the optional `include_ci_logs` input can work. A reusable workflow's permissions block cannot branch on an input, so the scope is declared unconditionally; it is read-only, and covers workflow run metadata and logs only. A caller who wants strictly the two scopes it uses should call the composite action directly with its own permissions block.
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch_depth }}

      - name: Review pull request
        uses: ./
        with:
          mode: review
          include_ci_logs: ${{ inputs.include_ci_logs }}
          severity_ratings: ${{ inputs.severity_ratings }}
          allowed_review_states: ${{ inputs.allowed_review_states }}
          include_suggestions: ${{ inputs.include_suggestions }}
          resolve_stale_threads: ${{ inputs.resolve_stale_threads }}
          fix_pr_metadata: ${{ inputs.fix_pr_metadata }}
          verify_prior_findings: ${{ inputs.verify_prior_findings }}
          structured_review_summary: ${{ inputs.structured_review_summary }}
          fix_ci_failures: ${{ inputs.fix_ci_failures }}
          fix_diff_findings: ${{ inputs.fix_diff_findings }}
          add_regression_tests: ${{ inputs.add_regression_tests }}
          resume_sessions: ${{ inputs.resume_sessions }}
          model: ${{ inputs.model }}
          settings: ${{ inputs.settings }}
          extra_claude_args: ${{ inputs.extra_claude_args }}
          allowed_bots: ${{ inputs.allowed_bots }}
          track_progress: ${{ inputs.track_progress }}
          use_sticky_comment: ${{ inputs.use_sticky_comment }}
          post_progress_comment: ${{ inputs.post_progress_comment }}
          include_fix_links: ${{ inputs.include_fix_links }}
          classify_inline_comments: ${{ inputs.classify_inline_comments }}
          include_comments_by_actor: ${{ inputs.include_comments_by_actor }}
          exclude_comments_by_actor: ${{ inputs.exclude_comments_by_actor }}
          bot_id: ${{ inputs.bot_id }}
          bot_name: ${{ inputs.bot_name }}
          plugins: ${{ inputs.plugins }}
          plugin_marketplaces: ${{ inputs.plugin_marketplaces }}
          use_bedrock: ${{ inputs.use_bedrock }}
          use_vertex: ${{ inputs.use_vertex }}
          use_foundry: ${{ inputs.use_foundry }}
          anthropic_federation_rule_id: ${{ inputs.anthropic_federation_rule_id }}
          anthropic_organization_id: ${{ inputs.anthropic_organization_id }}
          anthropic_service_account_id: ${{ inputs.anthropic_service_account_id }}
          anthropic_workspace_id: ${{ inputs.anthropic_workspace_id }}
          anthropic_oidc_audience: ${{ inputs.anthropic_oidc_audience }}
          display_report: ${{ inputs.display_report }}
          show_full_output: ${{ inputs.show_full_output }}
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
